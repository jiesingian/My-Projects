name: Build Projects Graph

# Monorepo-wide graphify pipeline, with no per-project setup: it discovers
# every top-level project folder (anything with a recognizable manifest
# file), builds or refreshes that project's own graph (code structure only,
# no API key needed), merges all of them into a root-level aggregate graph,
# and exports every graph.html. Add a new project folder and run this -- it's
# picked up automatically.
#
# The graphs are kept as a workflow artifact rather than published to Pages.
# Pages needs a paid plan on a private repository, and a public site would
# put every file path, module and function name in this app on a page anyone
# can find -- no secrets, but the architecture of a family's private app all
# the same. Download "projects-graph" from the run and open index.html.
#
# Was `push: branches: [main]` until 18 September -- every merge rebuilt it,
# which on a repo where automerge lands several pull requests a day made this
# one of the larger recurring costs on a metered Actions budget, for an
# artifact CLAUDE.md itself describes as occasional ("reach for the graph
# when grep returns more hits than you can triage, not before") rather than
# something that needs to be current to the last commit. A session's own
# fresh clone already gets a graph for free from the session-start hook,
# built locally with no Actions cost at all -- this workflow's artifact is
# for a person who wants one without cloning, which does not need to be
# rebuilt on every one of several merges a day. Weekly plus on-demand is
# still fresher than anyone has asked for it.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Read-only: nothing is published, so nothing needs write access.
permissions:
  contents: read

concurrency:
  group: projects-graph
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graphify
        run: pip install graphifyy

      - name: Extract each project (code structure only, no API key)
        run: |
          set -e
          for dir in */; do
            dir="${dir%/}"
            [[ "$dir" == .* ]] && continue
            marker=""
            for f in package.json pyproject.toml go.mod Cargo.toml requirements.txt; do
              [[ -f "$dir/$f" ]] && marker="$f" && break
            done
            [[ -z "$marker" ]] && continue
            echo "::group::extract $dir (found $marker)"
            graphify extract "$dir" --code-only
            echo "::endgroup::"
          done

      - name: Merge into monorepo-wide graph
        run: |
          set -e
          graphs=()
          for f in */graphify-out/graph.json; do
            [[ -f "$f" ]] && graphs+=("$f")
          done
          mkdir -p graphify-out
          if [[ ${#graphs[@]} -eq 1 ]]; then
            cp "${graphs[0]}" graphify-out/graph.json
          elif [[ ${#graphs[@]} -gt 1 ]]; then
            graphify merge-graphs "${graphs[@]}" --out graphify-out/graph.json
          fi

      - name: Export HTML for the aggregate and every project
        run: |
          set -e
          mkdir -p _site
          if [[ -f graphify-out/graph.json ]]; then
            graphify export html --graph graphify-out/graph.json
            cp graphify-out/graph.html _site/index.html
          fi
          for f in */graphify-out/graph.json; do
            [[ -f "$f" ]] || continue
            proj_dir="${f%/graphify-out/graph.json}"
            graphify export html --graph "$f"
            mkdir -p "_site/$proj_dir"
            cp "$proj_dir/graphify-out/graph.html" "_site/$proj_dir/index.html"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: projects-graph
          path: _site
          retention-days: 30
