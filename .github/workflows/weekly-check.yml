name: Weekly check

# One result a week, instead of two people watching each other's pushes --
# and, since 18 September, the one place the comprehensive end-to-end suite
# runs at all. Since 28 October also the week's watched-change digest: the
# `watched` job at the foot of this file, which has its own comment.
#
# The automatic checks on each pull request are the gate -- nothing merges
# without them. Those checks now run a fast, read-only smoke tier
# (e2e.yml) on every single push, on purpose: the suite's write-heavy
# specs -- every form, every RLS guarantee, delete-household.spec's cascade
# check -- take minutes a merge gate cannot afford to spend on every push
# without emptying a metered private repo's whole monthly Actions budget.
# This is where they still run, in full, against `main` as it actually
# stands, once a week, at an hour somebody is awake to read it.
#
# It exists because some failures cannot be caught by a pull request at all,
# and because a write-path regression deserves a bound on how long it can go
# unnoticed even though it is no longer a merge gate:
#
#   - A migration written, merged, and never run. The code and the database
#     drift apart with every check green, which is exactly what broke Settings
#     and Add account in front of a person on 9 September.
#   - Fixtures ageing out. This was a real risk rather than a hypothetical:
#     `regressions.spec` used to assert against activities somebody had seeded
#     by hand, dated Monday 7 September, and from Monday the 14th they fell
#     outside the week the Planner shows. It was rewritten to make its own,
#     anchored to today, and passed on the 14th with nothing to fix -- but the
#     class is what this line is for, and the next hand-seeded fixture will do
#     the same thing on its own schedule.
#   - A dependency, a Supabase change, or an expiring credential. Nobody pushes
#     anything and `main` stops working anyway.
#   - A write-path bug that only e2e.yml's now-narrower merge gate cannot see
#     -- the trade 18 September made on purpose. Caught here within a week
#     rather than never, instead of before every merge.
#
# WHEN THIS ACTUALLY RUNS, which is not what the cron says.
#
# 09:00 UTC is 17:00 in Manila -- Friday afternoon, meant to land while
# somebody is still at their desk. The workflow this replaced asked for
# 09:00 UTC daily and never once got it: measured across 11, 12 and
# 13 September it fired between 20:34 and 21:35 Manila, three and a half to
# four and a half hours late, varying by an hour between days. GitHub's
# scheduled workflows are best-effort on shared runners and the documentation
# says so; there is no queue to jump and no setting to change. Expect the
# same kind of drift here -- some time Friday evening rather than exactly
# 5pm -- and do not plan an evening around the hour in this comment.
# Measured here from 25 September to 23 October: the schedule fired between
# 13:38 and 15:41 UTC, 21:38 to 23:41 Friday in Manila, four and a half to
# seven hours late (#1138). Nobody waits on the hour -- the issue it opens
# is read whenever it lands -- so the cron line says "late is fine" and
# self-heal.yml's stale-claims check leaves it alone.
#
# WHAT IT RUNS, restored to the full suite 18 September. Between 18 September
# and this change it ran a narrower smoke.spec.ts + regressions.spec.ts pair,
# because back then e2e.yml ALSO ran the full suite on every push and this
# was mostly re-proving what had just been proven at the last merge. That
# stopped being true the moment e2e.yml's own scope narrowed to smoke + logic
# only -- this file is now the only place a write ever gets tested at all,
# so it runs everything, the way it did before 18 September's first pass.
on:
  schedule:
    - cron: "0 9 * * 5" # late is fine
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# The suite writes into the shared throwaway household, so this must queue
# behind any other run rather than race it -- see `turn` and `check` below.
#
# Until 19 October this said `concurrency: group: e2e`, "the same group name
# as e2e.yml used to share". e2e.yml had long since moved to per-branch
# groups, and on 18 October (#656) to `e2e-dev`, so `e2e` held nobody back.
# Run 38909472349 (attempt 2, 03:36-04:02 UTC 19 October) ran its 24 minutes
# beside five pull requests' End-to-end runs and seven Migrate runs on the
# same dev project and the same QA household. 791 passed; five failed the
# way an overloaded dev fails, and none failed locally on the same code:
# two `networkidle` page loads past 60s (the member profile, /today), two
# offline specs whose snapshot -- some forty reads, 8s after the page opens
# -- never landed in 45s, and a chat composer that never rendered.
jobs:
  # Waits, before the suite builds, until no End-to-end run is queued or
  # going. Not simply the `e2e-dev` group on its own: GitHub keeps one
  # waiting run per group and a newer waiter cancels the older one, so a
  # weekly check that had to wait behind a pull request would be cancelled by
  # the next pull request to queue -- and unlike theirs (automerge.yml re-runs
  # those), nothing re-runs this one. A week would pass with no check and no
  # issue. Polling costs runner minutes, but once a week, for a few of them;
  # e2e.yml dropped it (#656) because it ran on every push.
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      # Sparse: the wait script is all this job needs from the repository.
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: .github/scripts
      - name: Wait for a turn on dev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/wait-for-dev.sh

  check:
    name: the whole setup, against main (suite part 1 of 2)
    needs: turn
    runs-on: ubuntu-latest
    # Fifty, not thirty (25 October). The whole suite took 21 minutes on 19
    # October and kept growing; on the 23rd setup plus suite passed thirty and
    # the job was cut off mid-suite -- "cancelled", so no issue was filed and
    # the week went unchecked without anyone being told. Once a week, fifty is
    # still nowhere near a hung browser's six hours. If it creeps towards
    # fifty, split the suite rather than raise this again.
    #
    # Split 29 October, as that said. A run dispatched by hand that morning
    # (40813064660) was still in the suite at 47 minutes, against 32.6 the
    # day before, and was cut off at fifty -- and a job cut off at its limit
    # runs nothing after the step it was in: the report upload and "Say what
    # broke" stayed "pending", so again no issue and no report. Now the suite
    # runs in two halves (the browser specs, split by Playwright's --shard by
    # spec file; the logic specs run whole in this half), this job and
    # `check-2`, one after the other: they share the QA household and dev's
    # one e2e-dev slot, so never side by side. Each half's suite step has its
    # own limit, under the job's, so running out of time fails that step and
    # what follows it still runs. The issue is written by `report`, its own
    # job, which runs whatever happened to these two.
    timeout-minutes: 50
    # What `report` needs to say what happened, read from the steps. A job
    # cut off at its limit may leave these empty; `report` reads empty as
    # "not reached".
    outputs:
      tsc: ${{ steps.tsc.outcome }}
      lint: ${{ steps.lint.outcome }}
      build: ${{ steps.build.outcome }}
      schema: ${{ steps.schema.outcome }}
      logic: ${{ steps.logic.outcome }}
      e2e: ${{ steps.e2e.outcome }}
      prod_count: ${{ steps.errors.outputs.prod_count }}
    # The slot e2e.yml's runs take turns on: while this holds it, a pull
    # request's End-to-end waits (and if it is cancelled as an older waiter,
    # automerge.yml re-runs it). `turn` above means this almost never has
    # to wait for it itself. Not cancel-in-progress: a cancelled suite can
    # leave a preference it meant to restore.
    concurrency:
      group: e2e-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kin/package-lock.json

      - name: Check the secrets are present
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EMAIL: ${{ secrets.E2E_EMAIL }}
          PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$ANON" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "$EMAIL" ] || missing="$missing E2E_EMAIL"
          [ -n "$PASSWORD" ] || missing="$missing E2E_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"; exit 1
          fi

      - run: npm ci
        working-directory: kin

      # Each step records its own verdict rather than stopping the run, so one
      # failure does not hide the state of everything after it. A week where
      # three things broke should say three things broke.
      - name: Typecheck
        id: tsc
        if: always()
        working-directory: kin
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        if: always()
        working-directory: kin
        run: npm run lint

      # NEXT_PUBLIC_* is inlined at build time, so the build that the suite
      # then runs against has to be given them here or the app comes up
      # pointing at nothing.
      - name: Build
        id: build
        if: always()
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # Does the database have what the code believes in? The check that would
      # have caught the three unrun migrations.
      #
      # PROD_* belongs here and its absence cost three days. This step was
      # written before dev existed, when the only credentials there were WERE
      # production's. After the split on 10 September the same four names meant
      # dev, so this check quietly stopped looking at production -- while its
      # own header still said it was the thing that would have caught an unrun
      # migration.
      #
      # It then passed on the 11th, 12th and 13th with main's code writing
      # assets.updated_at and production having no such column, because dev did
      # have it. The one failure this file names in its own opening comment is
      # the one it was blind to.
      - name: Schema
        id: schema
        if: always()
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_E2E_EMAIL: ${{ secrets.PROD_E2E_EMAIL }}
          PROD_E2E_PASSWORD: ${{ secrets.PROD_E2E_PASSWORD }}
        run: node scripts/check-schema.mjs

      # "Errors this week": the most frequent error fingerprints the app
      # recorded in public.app_errors (client and server, no personal data;
      # 20261021010000_app_errors.sql), read as the same QA accounts the
      # Schema step uses -- the only accounts app_error_digest answers. Vercel
      # Hobby keeps logs for an hour; this is what is left of a week.
      # Never fails the job: it reports, the tests judge. Always in the run's
      # summary; in the issue when something else failed; and, on an
      # otherwise green week, an issue of its own only when production
      # recorded errors.
      - name: Errors this week
        id: errors
        if: always()
        continue-on-error: true
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_E2E_EMAIL: ${{ secrets.PROD_E2E_EMAIL }}
          PROD_E2E_PASSWORD: ${{ secrets.PROD_E2E_PASSWORD }}
        run: |
          node scripts/error-digest.mjs /tmp/errors.md
          cat /tmp/errors.md >> "$GITHUB_STEP_SUMMARY"

      # Caches only the browser binary, not the OS packages `--with-deps`
      # installs -- Playwright has no cache for those, and apt is fast enough
      # that it is not worth the risk of a stale system library. Keyed on the
      # exact installed version so a Playwright upgrade gets a fresh browser
      # rather than an incompatible cached one.
      - name: Playwright version
        if: always()
        id: pw-version
        working-directory: kin
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: always()
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install the browser
        if: always() && steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: kin
        run: npx playwright install --with-deps chromium

      - name: Install just the OS packages the cached browser still needs
        if: always() && steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: kin
        run: npx playwright install-deps chromium

      - name: Start the app
        if: always()
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run start &
          npx wait-on http://localhost:3000/login --timeout 120000

      # The Supabase values belong here as well as on the build, for the same
      # reason e2e.yml (before its own scope narrowed) used to spell them out
      # twice: locally playwright.config.ts reads them from .env.local, so
      # the specs that talk to PostgREST directly always had them. CI has no
      # .env.local, and without these twelve tests call test.skip() and the
      # run goes green having checked none of them.
      #
      # E2E_DELETE_* belongs here too. delete-household.spec.ts is the one
      # spec that destroys the household it runs against, so it uses a third
      # account that holds nothing between runs -- and without these two it
      # calls test.skip() and the run goes green having never proved that
      # deleting a household takes its rows with it. That is the one spec
      # standing between a cascade bug and somebody's records surviving their
      # own deletion, and it exists nowhere else in the suite.
      # The function-only specs (no browser, no server) on their own, so the
      # two halves below can split what takes the time: Playwright shards in
      # project order, so a plain --shard=1/2 gave part 1 all 920 logic tests
      # (a minute's work) and part 2 every one of the 279 browser tests.
      - name: Logic specs
        id: logic
        if: always()
        # About a minute; five, so setup + this + the suite's forty stays
        # under the job's fifty and the uploads below always get to run.
        timeout-minutes: 5
        working-directory: kin
        run: |
          set -o pipefail
          npm run test:logic 2>&1 | tee /tmp/logic-output.log

      - name: The suite, part 1 of 2 (the only place it still runs whole)
        id: e2e
        if: always()
        # Under the job's fifty, so a half that runs long fails here, and the
        # report and the log below still go up (see the job's comment).
        timeout-minutes: 40
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_DELETE_EMAIL: ${{ secrets.E2E_DELETE_EMAIL }}
          E2E_DELETE_PASSWORD: ${{ secrets.E2E_DELETE_PASSWORD }}
          # private-accounts.spec.ts; skips and says so when unset.
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
        # Piped through tee rather than left to the runner's own log, because
        # the runner's log is not reachable from here: it is served from
        # Actions' blob storage, which this project's tooling cannot reach.
        # The list reporter's own summary -- every failing test's name and
        # error together -- lands in /tmp/e2e-output.log instead, for "Say
        # what broke" below to fold into the issue it opens.
        #
        # pipefail is not optional. Without it the step's exit code is tee's,
        # which is always 0: on 9 October four tests failed (private-accounts
        # and three Who-picker specs) and this step, and the whole Weekly
        # check, reported success. A run: with no `shell:` gets `bash -e`,
        # not `-o pipefail`, so it has to be said here.
        run: |
          set -o pipefail
          npm run e2e -- --project=chromium --shard=1/2 2>&1 | tee /tmp/e2e-output.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: weekly-playwright-report-1
          path: kin/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # What the suite printed and the week's errors, for `report` to quote.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: weekly-notes-1
          path: |
            /tmp/logic-output.log
            /tmp/e2e-output.log
            /tmp/errors.md
          retention-days: 7
          if-no-files-found: ignore

  # The second half's own turn on dev, for the same reason as `turn`: when
  # `check` lets go of the e2e-dev slot, a post-merge End-to-end run is often
  # already waiting, and `check-2` queued behind it would be the older waiter
  # the next one cancels. `!cancelled()`, not `always()`: a half cut off at
  # its limit still lets the other half run, but a run somebody cancelled on
  # purpose stops here.
  turn-2:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: .github/scripts
      - name: Wait for a turn on dev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/wait-for-dev.sh

  # The suite's second half: `check`'s comment says why it is split. Only
  # what the suite needs is repeated here -- typecheck, lint, schema and the
  # week's errors were judged once, in `check`. The build is repeated because
  # the app has to run on this runner too.
  check-2:
    name: the whole setup, against main (suite part 2 of 2)
    needs: turn-2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: e2e-dev
      cancel-in-progress: false
    outputs:
      build: ${{ steps.build.outcome }}
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kin/package-lock.json

      - run: npm ci
        working-directory: kin

      # NEXT_PUBLIC_* inlined at build time, as in `check`.
      - name: Build
        id: build
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Playwright version
        id: pw-version
        working-directory: kin
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: kin
        run: npx playwright install --with-deps chromium

      - name: Install just the OS packages the cached browser still needs
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: kin
        run: npx playwright install-deps chromium

      - name: Start the app
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run start &
          npx wait-on http://localhost:3000/login --timeout 120000

      # The same secrets as part 1, for the same reasons (see `check`'s
      # suite step): without them the specs that talk to PostgREST skip and
      # the run goes green having checked none of them. pipefail likewise.
      - name: The suite, part 2 of 2
        id: e2e
        timeout-minutes: 40
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_DELETE_EMAIL: ${{ secrets.E2E_DELETE_EMAIL }}
          E2E_DELETE_PASSWORD: ${{ secrets.E2E_DELETE_PASSWORD }}
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
        run: |
          set -o pipefail
          npm run e2e -- --project=chromium --shard=2/2 2>&1 | tee /tmp/e2e-output.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: weekly-playwright-report-2
          path: kin/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: weekly-notes-2
          path: /tmp/e2e-output.log
          retention-days: 7
          if-no-files-found: ignore

  # The week's one word, from both halves. Its own job so that it runs
  # whatever became of them -- `always()`, cancelled included: on 23 and 29
  # October a half was cut off at its limit and, with the issue written
  # inside that job, nobody heard. Anything short of every check passing is
  # an issue now, and a half that never finished says so in as many words.
  report:
    needs: [check, check-2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each half's printed output and the week's errors; a half that died
      # before uploading simply has none.
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: weekly-notes-*
          path: /tmp/notes

      - name: Work out the week
        id: verdict
        env:
          R1: ${{ needs.check.result }}
          R2: ${{ needs.check-2.result }}
          TSC: ${{ needs.check.outputs.tsc }}
          LINT: ${{ needs.check.outputs.lint }}
          BUILD: ${{ needs.check.outputs.build }}
          SCHEMA: ${{ needs.check.outputs.schema }}
          LOGIC: ${{ needs.check.outputs.logic }}
          E2E1: ${{ needs.check.outputs.e2e }}
          BUILD2: ${{ needs.check-2.outputs.build }}
          E2E2: ${{ needs.check-2.outputs.e2e }}
        run: |
          set -euo pipefail
          # A step a half never reached has no outcome. Say why: its job was
          # cut off or cancelled, or it was never started.
          said() {
            local outcome="$1" job="$2"
            if [ -n "$outcome" ]; then echo "$outcome"
            elif [ "$job" = "cancelled" ]; then echo "cut off before it finished"
            elif [ "$job" = "skipped" ]; then echo "not run"
            else echo "not reached ($job)"; fi
          }
          {
            echo "tsc=$(said "$TSC" "$R1")"
            echo "lint=$(said "$LINT" "$R1")"
            echo "build=$(said "$BUILD" "$R1")"
            echo "schema=$(said "$SCHEMA" "$R1")"
            echo "logic=$(said "$LOGIC" "$R1")"
            echo "e2e1=$(said "$E2E1" "$R1")"
            echo "build2=$(said "$BUILD2" "$R2")"
            echo "e2e2=$(said "$E2E2" "$R2")"
          } >> "$GITHUB_OUTPUT"
          if [ "$R1" = "success" ] && [ "$R2" = "success" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      # Silence on a good week is the point. Nobody wants an issue every
      # Friday saying nothing happened -- that is the notification everybody
      # learns to swipe away, and then the one that matters goes with it.
      # A green run leaves its green tick in Actions and says nothing.
      - name: Say what broke
        if: steps.verdict.outputs.green != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TSC: ${{ steps.verdict.outputs.tsc }}
          LINT: ${{ steps.verdict.outputs.lint }}
          BUILD: ${{ steps.verdict.outputs.build }}
          SCHEMA: ${{ steps.verdict.outputs.schema }}
          LOGIC: ${{ steps.verdict.outputs.logic }}
          E2E1: ${{ steps.verdict.outputs.e2e1 }}
          BUILD2: ${{ steps.verdict.outputs.build2 }}
          E2E2: ${{ steps.verdict.outputs.e2e2 }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Manila date +%Y-%m-%d)

          {
            echo "The weekly check found something on \`main\`. Nobody pushed it this week"
            echo "necessarily — this runs against main as it stands, so a failure here can"
            echo "mean the database moved, a fixture aged out, a credential expired, or a"
            echo "write path broke since the last time this ran, as easily as it can mean"
            echo "a bad commit."
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Typecheck | $TSC |"
            echo "| Lint | $LINT |"
            echo "| Build | $BUILD |"
            echo "| Schema | $SCHEMA |"
            echo "| Logic specs | $LOGIC |"
            echo "| End-to-end, part 1 of 2 | $E2E1 |"
            echo "| Build for part 2 | $BUILD2 |"
            echo "| End-to-end, part 2 of 2 | $E2E2 |"
            echo
            echo "[The run, with the logs and the Playwright reports]($RUN_URL)"
            echo

            case "$E2E1 $E2E2" in
              *"cut off"*|*"not reached"*|*"not run"*)
                echo "**Part of the suite did not finish**, so whatever it had still to run"
                echo "was not checked this week. A half that ran out of its own 40 minutes"
                echo "reads \`failure\` above, with its output below; one cut off whole"
                echo "reads \"cut off before it finished\" and left nothing to quote. Re-run"
                echo "the workflow once dev is quiet; if the same half runs long again, it is"
                echo "a spec waiting on something, not a slow day."
                echo
                ;;
            esac

            for n in 1 2; do
              v="E2E$n"; outcome="${!v}"
              log="/tmp/notes/weekly-notes-$n/e2e-output.log"
              if [ "$outcome" != "success" ] && [ -s "$log" ]; then
                # Playwright ends every finished run with "N passed" or "N
                # failed"; a log without it was stopped mid-suite.
                if ! grep -Eq '^ +[0-9]+ (passed|failed)' "$log"; then
                  echo "Part $n ran out of time before it finished: the last test in its output is where it was."
                  echo
                fi
                echo "<details><summary>What part $n of the suite said</summary>"
                echo
                echo '```'
                tail -c 20000 "$log"
                echo '```'
                echo "</details>"
                echo
              fi
            done

            if [ "$LOGIC" = "failure" ] && [ -s /tmp/notes/weekly-notes-1/logic-output.log ]; then
              echo "<details><summary>What the logic specs said</summary>"
              echo
              echo '```'
              tail -c 20000 /tmp/notes/weekly-notes-1/logic-output.log
              echo '```'
              echo "</details>"
              echo
            fi

            if [ -s /tmp/notes/weekly-notes-1/errors.md ]; then
              cat /tmp/notes/weekly-notes-1/errors.md
              echo
            fi

            echo "If **Schema** is the one that failed, it is almost always a migration"
            echo "that has not been run against one of the two databases. The pipeline"
            echo "applies them: \`kin/supabase/migrations/\` holds them, dev takes them on"
            echo "merge, and production takes them when Jonathan runs the **Migrate**"
            echo "workflow. The failure names which database is behind."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/body.md

          # One issue per bad week, reopened rather than duplicated if the same
          # week fails twice (a manual re-run after a fix, say).
          EXISTING=$(gh issue list --repo "$REPO" --label "weekly-check" --state open \
            --search "Weekly check — $TODAY in:title" --json number --jq '.[0].number // empty')

          gh label create "weekly-check" --repo "$REPO" --color B60205 \
            --description "The weekly run of the whole setup found something." || true

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/body.md
          else
            gh issue create --repo "$REPO" \
              --title "Weekly check — $TODAY" \
              --label "weekly-check" \
              --body-file /tmp/body.md
          fi

      - name: Errors in production on a green week
        if: steps.verdict.outputs.green == 'true' && needs.check.outputs.prod_count != '' && needs.check.outputs.prod_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Manila date +%Y-%m-%d)
          {
            echo "The weekly check passed, but production recorded errors this week."
            echo "Each row is one fingerprint (the same message and stack), with how"
            echo "many times it happened; nothing personal is kept. [The run]($RUN_URL)"
            echo
            cat /tmp/notes/weekly-notes-1/errors.md
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/errors-body.md
          gh label create "weekly-check" --repo "$REPO" --color B60205 \
            --description "The weekly run of the whole setup found something." || true
          EXISTING=$(gh issue list --repo "$REPO" --label "weekly-check" --state open \
            --search "Errors this week — $TODAY in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/errors-body.md
          else
            gh issue create --repo "$REPO" --title "Errors this week — $TODAY" \
              --label "weekly-check" --body-file /tmp/errors-body.md
          fi

  # THE WATCHED-CHANGE DIGEST (since 28 October; before that, watched-change.yml).
  #
  # Says out loud, once a week, what landed on `main` in the territory where
  # a mistake cannot be undone in five minutes. Until 28 October a workflow of
  # its own (watched-change.yml) did this on every push to main and opened an
  # issue per push. Both people push many times a day, so it opened 341
  # issues in seven weeks and closed none of them, and the open-issue list
  # stopped meaning anything -- which is how a record earns being skimmed
  # past. Jonathan decided (28 October): the record stays, as one issue a
  # week, in the file that already is the one look a week.
  #
  # Three rules from the old workflow survive unchanged, and this job is
  # wrong the day any of them goes:
  #
  #   - It classifies from the diff, never from the commit message. CLAUDE.md
  #     asks for a "WATCHED:" line as a courtesy, and a courtesy is exactly
  #     what it is -- an agent asked to describe its own change describes it
  #     as small, and a tired person forgets. Nobody grades their own
  #     homework, so this asks git. The WATCHED line is quoted in the digest
  #     when there is one; it never decides whether a commit is in it.
  #   - Who pushed is not part of the decision either. Jonathan's own commits
  #     are listed the same as anyone's, which is both the honest rule and
  #     the one that cannot rot: an exemption keyed on a username is an
  #     exemption that silently covers whoever inherits the account.
  #   - The list of paths is the one triage.yml classifies pull requests
  #     from, copied by hand (see the comment on SENSITIVE below).
  #
  # It reads git history rather than a running log, because nothing may push
  # to `main` -- not a person, not a workflow -- and a log file committed
  # from here would be exactly that. The range starts where the previous
  # digest stopped: each digest ends with an HTML comment naming the `main`
  # commit it looked up to, and the next one reads it back from the newest
  # digest issue, open or closed. No previous digest (the first run, or an
  # issue somebody deleted): the last seven days. Scanning back to a digest
  # weeks old never repeats a commit, since any commit worth listing would
  # already have produced a digest of its own. The seven-day fallback can
  # miss a commit only when a whole week's run never happened AND there was
  # no digest before it to anchor on -- a narrow case, and a run that
  # reports a week rather than erroring is the better failure.
  #
  # Each commit on main's first-parent line is classified on its own diff
  # against its first parent -- for a squash merge that is the pull request,
  # for a merge commit it is what the merge brought in -- so a 20-line change
  # to an auth file is not hidden inside a 2,000-line week. A week with no
  # watched commit opens nothing: silence on a good week is the point, as
  # with the rest of this file.
  #
  # Its own job, not a step of `check`: it needs no dev database, so it must
  # not wait on `turn`, and a suite cancelled at its time limit (23 October)
  # must not take the week's record with it.
  watched:
    name: watched changes this week
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # The whole history: this diffs every commit of the week against
          # its parent, and the previous digest may be further back than
          # any depth worth guessing at.
          fetch-depth: 0

      - name: Work out what landed this week
        id: look
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # The same list triage.yml classifies from. Kept in step with it by
          # hand, which is a real cost -- but the two run on different events
          # with different inputs, and a shared file would have to be sourced
          # by a `pull_request_target` job, which is the one context where
          # reading a file from the branch is how a fork gets to run code here.
          SENSITIVE='^(
          kin/src/lib/actions/(auth|family|billing|wealth|drive)\.ts|
          kin/src/lib/supabase/|
          kin/src/lib/session\.ts|
          kin/src/lib/access\.ts|
          kin/src/lib/billing/|
          kin/src/proxy\.ts|
          kin/src/app/api/|
          kin/src/app/auth/|
          kin/src/app/login/|
          kin/src/app/signup/|
          kin/src/app/verify/|
          kin/src/app/forgot-password/|
          kin/src/app/reset-password/|
          kin/src/app/subscribe/|
          kin/next\.config\.|
          kin/package(-lock)?\.json|
          kin/eslint\.config\.|
          \.github/|
          \.claude/|
          \.gitignore|
          CLAUDE\.md|
          .*AGENTS\.md|
          LICENSE|
          .*\.sql
          )'
          SENSITIVE=$(printf '%s' "$SENSITIVE" | tr -d ' \n')

          HEAD_SHA=$(git rev-parse HEAD)

          # Where the previous digest stopped. Open or closed: Jonathan closes
          # a digest once he has read it, and that must not reset the range.
          # The marker is an HTML comment at the foot of every digest body.
          LAST=$(gh issue list --repo "$REPO" --label "watched-change" --state all --limit 1 \
              --search '"Watched changes on main" in:title sort:created-desc' \
              --json body --jq '.[0].body // empty' \
            | grep -oE '<!-- digest-end: [0-9a-f]{40} -->' | grep -oE '[0-9a-f]{40}' || true)

          if [ -n "$LAST" ] && git merge-base --is-ancestor "$LAST" HEAD 2>/dev/null; then
            RANGE_NOTE="since the previous digest stopped, at ${LAST:0:7}"
            COMMITS=$(git rev-list --first-parent --reverse "$LAST..HEAD")
          else
            if [ -n "$LAST" ]; then
              echo "The previous digest stopped at $LAST, which is not on main any more; falling back to seven days."
            else
              echo "No previous digest found; falling back to seven days."
            fi
            RANGE_NOTE="over the last seven days (no previous digest to start from)"
            COMMITS=$(git rev-list --first-parent --reverse --since="7 days ago" HEAD)
          fi

          LOOKED=0
          MATCHED=0
          : > /tmp/digest.md
          for C in $COMMITS; do
            LOOKED=$(( LOOKED + 1 ))
            # A root commit has no parent and nothing to diff against; main
            # has had one since 2 September, so this is never reached.
            git rev-parse -q --verify "$C^" > /dev/null || continue

            git diff --name-only "$C^" "$C" > /tmp/files.txt
            grep -E "$SENSITIVE" /tmp/files.txt > /tmp/watched.txt || true

            # numstat rather than shortstat: two integer columns per file, so
            # this needs no bc and no parsing of a sentence whose wording
            # changes with the count ("1 insertion" against "2 insertions").
            # A binary file reports "-" for both, which awk reads as 0 --
            # right, since a line count means nothing for one.
            TOTAL=$(git diff --numstat "$C^" "$C" | awk '{ a += $1; d += $2 } END { print a + d + 0 }')

            REASONS=""
            if [ -s /tmp/watched.txt ]; then
              REASONS="touches auth, data rules, billing, an API route, the toolchain, or a migration"
            fi
            if [ "$TOTAL" -gt 400 ]; then
              if [ -n "$REASONS" ]; then
                REASONS="$REASONS, and changes $TOTAL lines"
              else
                REASONS="changes $TOTAL lines, which is past the point of landing unread"
              fi
            fi
            [ -n "$REASONS" ] || continue
            MATCHED=$(( MATCHED + 1 ))

            SHORT="${C:0:7}"
            SUBJECT=$(git log -1 --format=%s "$C")
            AUTHOR=$(git log -1 --format=%an "$C")
            DATE=$(TZ=Asia/Manila git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M' "$C")
            # The courtesy line, quoted when present; it decided nothing above.
            # With the lines it wraps onto: people wrap at 72 columns, so the
            # line after a WATCHED: is usually the rest of it, up to a blank
            # line or the next "Something:" line (a trailer, or another flag).
            FLAG=$(git log -1 --format=%B "$C" | awk '
              /^WATCHED:/ { on = 1; print; next }
              on && (/^[[:space:]]*$/ || /^[A-Za-z-]+:/) { on = 0 }
              on { print }')

            {
              echo "### [\`$SHORT\`]($SERVER/$REPO/commit/$C) $SUBJECT"
              echo
              echo "$AUTHOR, $DATE Manila · $TOTAL lines · it $REASONS."
              echo
              if [ -n "$FLAG" ]; then
                echo "$FLAG" | sed 's/^/> /'
              else
                echo "> _No \`WATCHED:\` line in the commit message._"
              fi
              echo
              if [ -s /tmp/watched.txt ]; then
                echo '```'
                head -n 40 /tmp/watched.txt
                N=$(wc -l < /tmp/watched.txt)
                if [ "$N" -gt 40 ]; then echo "… and $(( N - 40 )) more"; fi
                echo '```'
              else
                echo '_No watched path — listed on size alone._'
              fi
              echo
            } >> /tmp/digest.md
          done

          echo "Looked at $LOOKED commit(s) on main $RANGE_NOTE; $MATCHED watched."
          {
            echo "## Watched changes on main"
            echo
            echo "Looked at $LOOKED commit(s) $RANGE_NOTE; **$MATCHED** in watched territory."
            echo
            cat /tmp/digest.md
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "looked=$LOOKED"
            echo "matched=$MATCHED"
            echo "range_note=$RANGE_NOTE"
            echo "head=$HEAD_SHA"
            if [ "$MATCHED" -gt 0 ]; then echo "watched=true"; else echo "watched=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Say so, once
        if: steps.look.outputs.watched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LOOKED: ${{ steps.look.outputs.looked }}
          MATCHED: ${{ steps.look.outputs.matched }}
          RANGE_NOTE: ${{ steps.look.outputs.range_note }}
          HEAD_SHA: ${{ steps.look.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Manila date +%Y-%m-%d)

          {
            echo "Changes that are expensive to undo landed on \`main\` this week. Nothing is wrong with them — this is a record, not an objection: one digest a week since 28 October, in place of an issue per push."
            echo
            echo "Looked at $LOOKED commit(s) $RANGE_NOTE; **$MATCHED** in watched territory. Each is classified from its own diff — never from the commit message or who pushed it."
            echo
            # GitHub stops an issue body at 65,536 characters. A week this
            # long would be its own kind of news; cut it rather than fail to
            # open the issue at all.
            head -c 60000 /tmp/digest.md
            if [ "$(wc -c < /tmp/digest.md)" -gt 60000 ]; then
              echo
              echo "_… cut here: the week was longer than an issue body holds. The run's summary has all of it._"
              echo
            fi
            # Deliberately does not claim a migration has not been run. It
            # cannot know: a file lands on main both before Jonathan runs it
            # and after, and the first version of the per-push issue said
            # "it has **not** been run" either way, which was already false
            # on the first issue it opened.
            echo "If a commit contains a \`.sql\` file, check whether it has been run before assuming either way — this digest cannot tell. \`migrate.yml\` applies migrations to dev on merge and to production when it is run with that target, so a file can sit on \`main\` with the schema unmoved."
            echo
            echo "[Workflow run]($RUN_URL)"
            echo
            echo "<!-- digest-end: $HEAD_SHA -->"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/body.md

          gh label create "watched-change" --repo "$REPO" --color FBCA04 \
            --description "Landed on main in territory where a mistake is expensive." || true

          gh issue create --repo "$REPO" \
            --title "Watched changes on main — week of $TODAY" \
            --label "watched-change" \
            --body-file /tmp/body.md
