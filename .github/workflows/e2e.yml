name: End-to-end

# The fast tier of the suite: every hub's pages load clean, plus every pure
# function the suite has (`*.logic.spec.ts`). Runs on pull requests and on
# demand -- and, restructured 18 September, exists specifically so it CAN run
# on every push without either blocking a merge for ten-plus minutes or
# costing the whole repository's monthly Actions budget to do it.
#
# The comprehensive suite -- every write, every form, every RLS guarantee,
# the specs with a real household behind them -- moved to weekly-check.yml,
# once a week rather than once a push. That is the trade this file makes: a
# real bug in one write path is caught within a week instead of before merge.
# What stays a merge gate is the class of bug that showed up without any spec
# having to write a row at all -- "a calendar filing Monday under Sunday, an
# edit form walking an activity eight hours earlier on each save, a week that
# never started on the day the household chose" all rendered wrong on their
# very first paint, which smoke.spec.ts alone would already have caught.
#
# Scoped to paths that can actually break it, so documentation and workflow
# edits do not pay for a browser run.
#
# It runs on pushes to main as well as on pull requests, and has to: pull
# requests stopped being required here on 9 September -- both people push
# straight to main now -- so a suite that only watched pull requests would
# have quietly stopped watching almost everything.
#
# Needs two repository secrets, and says so plainly rather than failing with a
# login screen if they are missing:
#   E2E_EMAIL, E2E_PASSWORD             -- the throwaway household, never a real one
#   NEXT_PUBLIC_SUPABASE_URL, _ANON_KEY -- both public by design; RLS is the real guard
#
# pull_request, deliberately, not pull_request_target: GitHub withholds secrets
# from fork-triggered runs under the former, which is the behaviour we want if
# this repository is ever opened up.
on:
  pull_request:
    paths:
      - "kin/src/**"
      - "kin/e2e/**"
      - "kin/package.json"
      - "kin/package-lock.json"
      - "kin/playwright.config.ts"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "kin/src/**"
      - "kin/e2e/**"
      - "kin/package.json"
      - "kin/package-lock.json"
      - "kin/playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Where to point the suite (blank builds and runs the app here)"
        required: false
        type: string

permissions:
  contents: read

# Per branch, and cancelling a superseded run outright rather than letting it
# finish. This was global and queued until 18 September -- every spec wrote
# into the same throwaway household, so two runs in parallel would read each
# other's data and fail for reasons that had nothing to do with the code.
# That risk is gone now that this file only runs smoke.spec.ts and the logic
# specs: nothing here writes a row, so two different pull requests' runs
# genuinely cannot collide, and a pull request pushed to five times in ten
# minutes can safely cancel the first four instead of queueing behind them.
# The comprehensive suite that DOES write, in weekly-check.yml, keeps the old
# global queued lock -- it still needs it.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Minutes, not the old suite's seven-plus -- see the header. The default
    # job limit is six hours, which is how a hung browser quietly spends a
    # month of Actions minutes; ten is generous for what this file runs now.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kin/package-lock.json

      - name: Refuse to run without a throwaway account
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        run: |
          if [ -z "$E2E_EMAIL" ]; then
            echo "::error::E2E_EMAIL and E2E_PASSWORD are not set. Add them as repository secrets, pointing at a throwaway household — never a real family's account. See kin/e2e/README.md."
            exit 1
          fi

      - run: npm ci

      # Caches only the browser binary, not the OS packages `--with-deps`
      # installs -- Playwright has no cache for those, and apt is fast enough
      # that it is not worth the risk of a stale system library. Keyed on the
      # exact installed version so a Playwright upgrade gets a fresh browser
      # rather than an incompatible cached one.
      - name: Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install just the OS packages the cached browser still needs
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # On a pull request there is no `inputs` at all, so this is the normal
      # path: build the app and test what the branch actually produces.
      - name: Build and start, unless a URL was given
        if: ${{ !inputs.base_url }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/login --timeout 120000

      # smoke.spec.ts and the logic specs only -- see the header for why the
      # rest moved to weekly-check.yml. `--workers=4` is safe specifically
      # because none of this writes anything: playwright.config.ts pins
      # `workers: 1` globally for the specs that do, but nothing here needs
      # that serialization, so the CLI flag overrides it for this run only.
      - name: Run the suite (smoke + logic, not the full regression)
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx playwright test e2e/smoke.spec.ts e2e/*.logic.spec.ts --workers=4

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: kin/playwright-report/
          retention-days: 7
