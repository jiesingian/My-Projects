name: End-to-end

# Runs on pull requests that touch the app, and on demand.
#
# It was manual-only, on the argument that a suite driving sixty browser pages
# is too expensive to run unattended on a metered private repo. That was worth
# checking rather than believing: the suite takes about seven minutes, and at
# the rate this repository actually moves that is well inside the free tier.
# Meanwhile every bug found here so far -- a calendar filing Monday under
# Sunday, an edit form walking an activity eight hours earlier on each save, a
# week that never started on the day the household chose -- passed tsc, lint
# and build without a murmur. Seven minutes a pull request is the cheaper side
# of that trade.
#
# Scoped to paths that can actually break it, so documentation and workflow
# edits do not pay for a browser run.
#
# It runs on pushes to main as well as on pull requests, and has to: pull
# requests stopped being required here on 9 September -- both people push
# straight to main now -- so a suite that only watched pull requests would
# have quietly stopped watching almost everything. tsc, lint and build already
# run on every push through ci.yml; this is the only check that opens a page
# and looks at it, and every timezone bug this project has had passed the
# other three without a murmur.
#
# Needs four repository secrets, and says so plainly rather than failing with a
# login screen if they are missing:
#   E2E_EMAIL, E2E_PASSWORD             -- the throwaway household, never a real one
#   NEXT_PUBLIC_SUPABASE_URL, _ANON_KEY -- both public by design; RLS is the real guard
#
# pull_request, deliberately, not pull_request_target: GitHub withholds secrets
# from fork-triggered runs under the former, which is the behaviour we want if
# this repository is ever opened up.
on:
  pull_request:
    paths:
      - "kin/src/**"
      - "kin/e2e/**"
      - "kin/package.json"
      - "kin/package-lock.json"
      - "kin/playwright.config.ts"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "kin/src/**"
      - "kin/e2e/**"
      - "kin/package.json"
      - "kin/package-lock.json"
      - "kin/playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Where to point the suite (blank builds and runs the app here)"
        required: false
        type: string

permissions:
  contents: read

# One run at a time, globally rather than per branch. Every spec writes rows
# into the same throwaway household, so two runs in parallel would read each
# other's data and fail for reasons that have nothing to do with the code.
# Queued rather than cancelled: a cancelled run can leave a preference the
# suite meant to restore.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The suite takes about seven minutes. The default job limit is six hours,
    # which is how a hung browser quietly spends a month of Actions minutes.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kin/package-lock.json

      - name: Refuse to run without a throwaway account
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        run: |
          if [ -z "$E2E_EMAIL" ]; then
            echo "::error::E2E_EMAIL and E2E_PASSWORD are not set. Add them as repository secrets, pointing at a throwaway household — never a real family's account. See kin/e2e/README.md."
            exit 1
          fi

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # On a pull request there is no `inputs` at all, so this is the normal
      # path: build the app and test what the branch actually produces.
      - name: Build and start, unless a URL was given
        if: ${{ !inputs.base_url }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/login --timeout 120000

      # The Supabase values belong here as well as on the build. Locally
      # playwright.config.ts reads them out of .env.local, so the specs that
      # talk to PostgREST directly -- every row-level-security guarantee, every
      # household preference, and the stored-instant assertion -- always had
      # them. CI has no .env.local, so those twelve tests called test.skip()
      # and the run went green having checked none of them. A suite that
      # quietly tests less in CI than on a laptop is worse than one that fails.
      # E2E_DELETE_* belongs here too, and its absence was the same failure one
      # layer further out. delete-household.spec.ts is the only test that
      # destroys the household it runs against, so it uses a third account that
      # holds nothing between runs -- and without these two it calls
      # test.skip() and the run goes green having never proved that deleting a
      # household takes its rows with it. That is the one spec standing between
      # a cascade bug and somebody's records surviving their own deletion.
      #
      # daily-check.yml has passed them since it was written. This file never
      # did, so the secrets existed and the pull-request suite skipped the test
      # anyway -- which is exactly the shape of "a suite that quietly tests
      # less in CI than on a laptop" that the comment above is about.
      - name: Run the suite
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_DELETE_EMAIL: ${{ secrets.E2E_DELETE_EMAIL }}
          E2E_DELETE_PASSWORD: ${{ secrets.E2E_DELETE_PASSWORD }}
          E2E_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run e2e

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: kin/playwright-report/
          retention-days: 7
