name: End-to-end

# The fast tier of the suite: every hub's pages load clean, plus every pure
# function the suite has (`*.logic.spec.ts`). Runs on pull requests and on
# demand -- and, restructured 18 September, exists specifically so it CAN run
# on every push without either blocking a merge for ten-plus minutes or
# costing the whole repository's monthly Actions budget to do it.
#
# The comprehensive suite -- every write, every form, every RLS guarantee,
# the specs with a real household behind them -- moved to weekly-check.yml,
# once a week rather than once a push. That is the trade this file makes: a
# real bug in one write path is caught within a week instead of before merge.
# What stays a merge gate is the class of bug that showed up without any spec
# having to write a row at all -- "a calendar filing Monday under Sunday, an
# edit form walking an activity eight hours earlier on each save, a week that
# never started on the day the household chose" all rendered wrong on their
# very first paint, which smoke.spec.ts alone would already have caught.
#
# Scoped to paths that can actually break it, so documentation and workflow
# edits do not pay for a browser run.
#
# It runs on pushes to main as well as on pull requests, and has to: pull
# requests stopped being required here on 9 September -- both people push
# straight to main now -- so a suite that only watched pull requests would
# have quietly stopped watching almost everything.
#
# Needs two repository secrets, and says so plainly rather than failing with a
# login screen if they are missing:
#   E2E_EMAIL, E2E_PASSWORD             -- the throwaway household, never a real one
#   NEXT_PUBLIC_SUPABASE_URL, _ANON_KEY -- both public by design; RLS is the real guard
#
# pull_request, deliberately, not pull_request_target: GitHub withholds secrets
# from fork-triggered runs under the former, which is the behaviour we want if
# this repository is ever opened up.
on:
  pull_request:
    paths:
      - "kin/src/**"
      - "kin/e2e/**"
      - "kin/package.json"
      - "kin/package-lock.json"
      - "kin/playwright.config.ts"
      - ".github/workflows/e2e.yml"
      # A migration on its own changes what every page reads, and
      # smoke-private-db is the one job that applies a pull request's
      # migrations and opens the pages; without these a .sql-only pull
      # request merged and reached production untried (29 October). Not on
      # push: main's run could start before migrate.yml has applied it.
      - "kin/supabase/migrations/**"
      - "kin/scripts/migrate.mjs"
  push:
    branches: [main]
    paths:
      - "kin/src/**"
      - "kin/e2e/**"
      - "kin/package.json"
      - "kin/package-lock.json"
      - "kin/playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Where to point the suite (blank builds and runs the app here)"
        required: false
        type: string

permissions:
  # WRITE, since 20 October, for one thing: the phone-width screenshots push
  # their before/after pictures to the `ci-screenshots` branch (an orphan
  # branch of nothing but PNGs; kin/scripts/visual-comment.sh), because the
  # API cannot attach an image to a comment. The token still cannot touch
  # main: pushing there goes through automerge.yml, and nothing here checks
  # out a branch to write to. Forks get a read-only token regardless.
  contents: write
  # The same step edits its one comment on the pull request.
  pull-requests: write
  # Only so the dev pre-flight below can cancel its own run when dev is down
  # (kin/scripts/dev-preflight.sh, 19 October), and, since 20 October, so a
  # pull request can download main's `visual-baseline` artifact.
  actions: write

# Per branch, and cancelling a superseded run outright rather than letting it
# finish. This was global and queued until 18 September -- every spec wrote
# into the same throwaway household, so two runs in parallel would read each
# other's data and fail for reasons that had nothing to do with the code.
# That risk is gone now that this file only runs smoke.spec.ts and the logic
# specs: nothing here writes a row, so two different pull requests' runs
# genuinely cannot collide, and a pull request pushed to five times in ten
# minutes can safely cancel the first four instead of queueing behind them.
# The comprehensive suite that DOES write, in weekly-check.yml, takes its
# turn in the same `e2e-dev` group as the job below (19 October: it was in
# an `e2e` group nobody else used any more, and raced these runs on dev).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One run on dev at a time, the rest waiting their turn (8 October; it was
  # two until that afternoon).
  #
  # Smoke opens every hub at every width in both themes -- about forty page
  # loads, each signing in and firing twenty-odd queries -- against the one
  # small dev project every pull request shares. Two runs at once it takes in
  # its stride (05:02-05:10 UTC that morning: ~0.5s a request, both green).
  # When a merge to main sent six to eight pull requests back through CI
  # within minutes, dev's response time went from ~0.5s to 9-20s on average
  # (worst ~2 minutes) on every table alike -- not one slow query, just too
  # many at once -- and every run, main's own included, timed out page by
  # page and was cancelled at twenty minutes. Nothing failed; dev never
  # returned an error; it was simply queued solid. From 10:07 UTC the same
  # day, with two e2e runs and a couple of Schema checks going, dev stopped
  # answering altogether: sign-in 504s for minutes, and statements timing out
  # on every table, Supabase's own `SELECT version();` included.
  #
  # How the waiting is done changed on 18 October. Until then a separate
  # `turn` job polled the API every 30 seconds until nothing was ahead of it,
  # for up to forty minutes -- and GitHub bills a job for every minute it
  # sleeps. It was the largest single use of the repository's Actions
  # minutes: 464 of 1,157 measured over 13-15 October went to this workflow,
  # much of it waiting, and the month's allowance ran out on the 15th with
  # every check on every pull request failing in two seconds.
  #
  # Now the e2e job itself sits in one repository-wide concurrency group.
  # A job waiting on a concurrency group has no runner and costs nothing.
  # The catch, and why the polling existed: GitHub keeps only ONE waiting run
  # per group, and a newer waiter cancels the older one ("Canceling since a
  # higher priority waiting request ... exists"). So with three pull requests
  # pushed at once, the middle one is cancelled rather than queued. That
  # cancelled run is not lost: automerge.yml's 15-minute sweep finds a pull
  # request whose End-to-end on its current head was cancelled with nothing
  # else running, and re-runs it (at most three attempts per commit, so a run
  # that is cancelled for some other reason cannot loop). Slower through a
  # backlog than the old first-come queue; nothing skipped, nothing paid for
  # waiting.
  #
  # The workflow-level group above still cancels a pull request's own
  # superseded runs; this one only decides whose turn it is on dev.
  #
  # NOT ON PULL REQUESTS since 23 October (Jonathan). One turn at a time on
  # dev, with GitHub keeping only one waiter, meant a busy morning's pull
  # requests merged one every 15-25 minutes (six of them waited three hours
  # on 23 October with nothing wrong in them). A pull request is now gated by
  # smoke-private-db below -- the same smoke on a database of its own, every
  # pull request at once. This job still runs here on main after every merge
  # (automerge.yml dispatches it) and on demand, so dev's own settings,
  # Realtime (chat-live), push targets and the real sample household are
  # still checked within minutes of a merge, one run at a time as before.
  e2e:
    if: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: e2e-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Minutes, not the old suite's seven-plus -- see the header. The default
    # job limit is six hours, which is how a hung browser quietly spends a
    # month of Actions minutes, so there is still a cap.
    #
    # Twenty, not ten (7 October). Ten stopped being generous: the smoke and
    # logic specs had grown to ~480 tests and a normal run took 8 to 10
    # minutes, so on a slow runner the job was cut off at 10m15s and reported
    # "cancelled" -- seven pull requests stuck that day with nothing wrong in
    # them, and one more failed on a single page load at the 60s test timeout
    # while its other 478 tests passed. Twenty is double a healthy run: room
    # for a slow runner, still nowhere near a hung browser's six hours. If
    # runs creep towards twenty, split the suite rather than raise this again.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kin/package-lock.json

      - name: Refuse to run without a throwaway account
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        run: |
          if [ -z "$E2E_EMAIL" ]; then
            echo "::error::E2E_EMAIL and E2E_PASSWORD are not set. Add them as repository secrets, pointing at a throwaway household — never a real family's account. See kin/e2e/README.md."
            exit 1
          fi

      # Is dev answering at all? On 19 October dev's Auth stopped and every
      # PR's run failed at sign-in. This waits up to ~4 minutes for it, then
      # cancels the run instead of failing it; automerge.yml re-runs it later.
      # Skipped when a base_url was given (then dev is not what is tested).
      - name: Dev is answering
        if: ${{ !inputs.base_url }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: bash scripts/dev-preflight.sh "$URL" "$ANON"
      - run: npm ci

      # Caches only the browser binary, not the OS packages `--with-deps`
      # installs -- Playwright has no cache for those, and apt is fast enough
      # that it is not worth the risk of a stale system library. Keyed on the
      # exact installed version so a Playwright upgrade gets a fresh browser
      # rather than an incompatible cached one.
      - name: Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install just the OS packages the cached browser still needs
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # On a pull request there is no `inputs` at all, so this is the normal
      # path: build the app and test what the branch actually produces.
      - name: Build and start, unless a URL was given
        if: ${{ !inputs.base_url }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/login --timeout 120000

      # smoke.spec.ts and the logic specs -- see the header for why the
      # rest moved to weekly-check.yml -- plus chat-live.spec.ts (12 October):
      # two people in one group chat in two browsers, the one check that
      # Realtime reaches the other person's screen. It cannot run in an agent
      # sandbox (no WebSockets through its proxy), so this is where it runs.
      # It writes, but only its own messages into its own "E2E live chat"
      # group, and takes them back out. `--workers=4` is safe specifically
      # because nothing else here writes anything: playwright.config.ts pins
      # `workers: 1` globally for the specs that do, but nothing here needs
      # that serialization, so the CLI flag overrides it for this run only.
      - name: Run the suite (smoke + logic + live chat, not the full regression)
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # The household's second grown-up, for private-accounts.spec.ts and
          # chat-live.spec.ts (docs/QA_HOUSEHOLDS.md). Unset, both skip and say so.
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
          E2E_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        # 2 workers, not 4: every page signs the request in against dev's
        # auth server, and with twenty pull requests testing at once 4 each was
        # enough to run it out of database connections (7 October).
        run: npx playwright test e2e/smoke.spec.ts e2e/chat-live.spec.ts e2e/push-targets-live.spec.ts e2e/*.logic.spec.ts --workers=2

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: kin/playwright-report/
          retention-days: 7

      # ── Phone-width screenshots, compared with main (20 October) ──────────
      #
      # Five screens (Today, Chat, Planner, To-Buy, Wealth) at 390px, Simple
      # Kin off and on, as the sample household, each compared with the same
      # picture from main's last run here. e2e/visual.spec.ts has the why and
      # the threshold. Three rules of the house hold:
      #
      #   - It runs INSIDE this job, after the smoke run, with one worker: no
      #     new job racing the e2e-dev turn-lock (#656/#701/#704), ten page
      #     loads on top of smoke's forty-odd, and Simple Kin is flipped on
      #     the sample member only while nothing else is loading pages.
      #     Since 23 October pull requests take theirs in smoke-private-db
      #     below (an empty household, compared with main's run of that job);
      #     this job no longer runs on pull requests, so here the steps only
      #     keep main's real-household pictures as a record.
      #   - IT FAILS ON A REAL DIFFERENCE (since 21 October). It was warn-only
      #     from 20 October, meant to last until 27 October; Jonathan moved
      #     the date up. The warn-only days: 4 warnings in 35 pull-request
      #     runs, 1 real (#814's Today offer card), 3 the clock (next bullet),
      #     none from live data, animation or fonts. With the clock frozen
      #     (#830) the noise had no cause left; the pull request that turned
      #     this on was itself the first run compared with a frozen baseline.
      #     A screen over the threshold now fails this job; the failure says
      #     how to accept an intended change: the screen's slug in
      #     kin/e2e/visual-accept/<PR>.txt in the same pull request (one file
      #     per pull request, so two never conflict), since the
      #     baseline is main's run and refreshes itself on merge. If noise
      #     comes back, set `VISUAL_WARN_ONLY: "1"` on the step below to go
      #     back to warning while it is found.
      #   - THE CLOCK IS FROZEN (21 October). The warn-only days counted 4
      #     warnings in 35 pull-request runs, 3 of them the clock: main's
      #     picture from an earlier Manila day or time of day. The server runs
      #     under libfaketime from VISUAL_FROZEN_AT, the last 06:00 in Manila,
      #     and only a baseline from that same moment is compared (the spec
      #     has the details). Main idle since before 06:00: nothing to compare
      #     with until main's next run.
      #   - The baseline is an artifact, not a file in the repository: main's
      #     run (automerge.yml dispatches this workflow on main after each
      #     merge) uploads `visual-baseline`; a pull request's run downloads
      #     the newest one. No artifact yet (the first run, a new screen):
      #     the pictures are taken and recorded, compared with nothing.
      #
      # When a screen differs, kin/scripts/visual-comment.sh pushes the
      # before/after/diff PNGs to the `ci-screenshots` branch and puts one
      # comment on the pull request, edited in place on later pushes. Nothing
      # changed: no pictures pushed, no comment (or the earlier comment says
      # "back to main"). Every one of these steps is skipped when a base_url
      # was given: then dev is not what is tested.
      - name: Main's screenshots, to compare with
        if: ${{ !inputs.base_url && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/visual-baseline.sh

      # The last 06:00 in Manila (22:00 UTC), for every run that day, main's
      # and pull requests' alike. Behind real time, never ahead: a session
      # token minted now must not look expired to the frozen server. 06:00
      # is the quietest hour to have the day turn over.
      - name: Freeze the clock for the screenshots
        if: ${{ !inputs.base_url }}
        run: |
          (sudo apt-get install -y -q faketime >/dev/null 2>&1 || (sudo apt-get update -q >/dev/null && sudo apt-get install -y -q faketime >/dev/null)) && command -v faketime
          if [ "$(date -u +%H)" -ge 22 ]; then day=$(date -u +%F); else day=$(date -u -d yesterday +%F); fi
          echo "VISUAL_FROZEN_AT=$day 22:00:00" >> "$GITHUB_ENV"
          echo "Screenshots at $day 22:00 UTC (06:00 the next morning in Manila)."

      - name: Phone-width screenshots (five screens, Simple Kin off and on)
        if: ${{ !inputs.base_url }}
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Which pull request is under test, for kin/e2e/visual-accept/<PR>.txt.
          VISUAL_PR: ${{ github.event.pull_request.number }}
          # Its own report folder, so the smoke run's report above is not
          # overwritten before it is uploaded.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-visual
        run: npx playwright test e2e/visual.spec.ts --workers=1

      - name: Keep these as main's baseline
        if: ${{ !inputs.base_url && github.ref == 'refs/heads/main' && !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: visual-baseline
          path: |
            kin/visual-out/*.png
            kin/visual-out/frozen-at.txt
            !kin/visual-out/*-diff.png
          retention-days: 30

      - name: Before and after, on the pull request
        if: ${{ !inputs.base_url && github.event_name == 'pull_request' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/visual-comment.sh

      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.base_url && !cancelled() }}
        with:
          name: visual-screenshots
          path: |
            kin/visual-out/
            kin/playwright-report-visual/
          retention-days: 7

  # ── The same smoke run on a private database (19 October, trial) ──────────
  #
  # Every check above shares one free-plan dev project with every other pull
  # request and every Claude session. On 19 October that sharing overloaded
  # it until its Auth stopped, and fifteen PRs went red at once. Larger teams
  # do not share: each run gets its own database. This job does that for free
  # (Actions minutes cost nothing while the repo is public):
  #
  #   1. start Supabase inside this runner (Docker; gone when the run ends);
  #   2. copy dev's schema into it -- structure only, `supabase db dump`, no
  #      rows: no household's data leaves dev, and dev only answers one dump;
  #   3. record which migrations dev already has, then let scripts/migrate.mjs
  #      add this PR's new ones -- so a migration is tested before it merges;
  #   4. make the QA account and its household through the app's own
  #      create_family(), as a person signing up would;
  #   5. build against it and run the same smoke + logic specs.
  #
  # It was a TRIAL (continue-on-error) from 19 October. Its record when it
  # became the pull-request gate (23 October, Jonathan): 150 runs over
  # 22-23 October, 121 green, 24 cancelled as superseded, 5 red -- three
  # real (two broken specs, one migration timestamped behind one already on
  # dev) and two the port clash fixed below. Nothing here writes to dev.
  #
  # It now also takes the phone-width screenshots on pull requests (the
  # visual steps, moved from the job above), against main's screenshots from
  # this same job. Its household is empty, so the pictures are of every
  # screen's frame and empty states, the same on every run -- no live data
  # to move them.
  smoke-private-db:
    if: ${{ !inputs.base_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kin
    env:
      E2E_EMAIL: qa-private@example.com
      # A throwaway password for a database that exists for one run.
      E2E_PASSWORD: private-db-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kin/package-lock.json
      # A fixed version, not `latest` (20 October). `latest` is resolved
      # through api.github.com without a token, and GitHub's hosted runners
      # share that unauthenticated quota: from 11:56 UTC on 20 October this
      # step died in its first second on every run ("Failed to resolve latest
      # Supabase CLI release: rate limit exceeded"), on pull requests whose
      # diffs never touched it. A fixed version is fetched from npm, which has
      # no such limit. Bump it by hand when a newer CLI is wanted.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start a private Supabase (only what Kin's pages use)
        working-directory: ${{ runner.temp }}
        run: |
          # Its own folder, so `supabase start` does not try to run
          # kin/supabase/migrations on an empty database (they assume the
          # hand-built tables from September). The schema comes from dev below.
          mkdir -p ci-db/supabase && cp "$GITHUB_WORKSPACE/kin/supabase/config.toml" ci-db/supabase/
          cd ci-db
          # "failed to bind host port 0.0.0.0:54322: address already in use"
          # on a fresh runner (22 and 23 October, 2 runs in 150). Nothing was
          # listening there: Linux hands out 32768-60999 as the source ports
          # of outgoing connections, Supabase's 54320-54329 sit inside that
          # range, and the image pulls just before open hundreds of them.
          # Reserving the range keeps the kernel off it; one retry, after a
          # clean stop, covers anything else that was transient.
          sudo sysctl -q -w net.ipv4.ip_local_reserved_ports=54320-54329
          for attempt in 1 2; do
            if supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit; then break; fi
            [ "$attempt" = 2 ] && exit 1
            echo "::warning::supabase start failed; stopping and trying once more."
            supabase stop --no-backup || true
            sleep 10
          done
          supabase status -o env > "$RUNNER_TEMP/local.env"
      # Dev's schema, kept a week (23 October). The dump took dev about 90
      # seconds of work on every run of every pull request. Dev's schema
      # only changes through migrations in this repository (migrate.yml), so
      # an older copy plus the migrations that came after it -- which the
      # next step applies from this checkout -- is the same schema, and they
      # get tested on the way. Main's run saves a fresh copy once a week
      # (caches saved on main are the ones every pull request can read); a
      # pull request only dumps dev itself if no copy exists at all.
      - name: This week's key for dev's schema
        id: schema-key
        run: echo "key=dev-schema-v1-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Dev's schema from the cache
        id: schema-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/schema.sql
            ${{ runner.temp }}/applied.txt
          key: ${{ steps.schema-key.outputs.key }}
          restore-keys: dev-schema-v1-
      - name: Copy dev's schema (structure only, no rows), if there is no copy
        if: ${{ steps.schema-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || steps.schema-cache.outputs.cache-matched-key == '') }}
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$DEV_DB_URL" ] || { echo "::error::DEV_DB_URL is not set, so there is no schema to copy."; exit 1; }
          supabase db dump --db-url "$DEV_DB_URL" --schema public -f "$RUNNER_TEMP/schema.sql"
          psql "$DEV_DB_URL" -Atc "select version from supabase_migrations.schema_migrations order by version" > "$RUNNER_TEMP/applied.txt"
          echo "fresh=1" >> "$GITHUB_ENV"
      - name: Keep it for the week
        if: ${{ env.fresh == '1' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/schema.sql
            ${{ runner.temp }}/applied.txt
          key: ${{ steps.schema-key.outputs.key }}
      # The one thing a week-old copy cannot say: whether this branch's new
      # migration is timestamped behind one dev has run since (migrate.mjs
      # refuses that on merge; 23 October's #909 was caught here). Dev's list
      # of applied versions is one small query, so it is read every time.
      - name: This branch's migrations come after dev's
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          set -euo pipefail
          echo "Schema: $(grep -c '^CREATE TABLE' "$RUNNER_TEMP/schema.sql") tables; the copy records $(wc -l < "$RUNNER_TEMP/applied.txt") migrations."
          [ -n "$DEV_DB_URL" ] || exit 0
          psql "$DEV_DB_URL" -Atc "select version from supabase_migrations.schema_migrations order by version" > "$RUNNER_TEMP/dev-now.txt"
          newest=$(tail -1 "$RUNNER_TEMP/dev-now.txt")
          late=""
          for f in "$GITHUB_WORKSPACE"/kin/supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -d_ -f1)
            grep -qx "$v" "$RUNNER_TEMP/dev-now.txt" && continue
            [[ "$v" < "$newest" ]] && late="$late $(basename "$f")"
          done
          if [ -n "$late" ]; then
            echo "::error::Pending migration(s) older than $newest, which dev has already run:$late. Rename them with a timestamp later than that, so they run in the order they were written in."
            exit 1
          fi
      - name: Load it, then add this PR's migrations
        run: |
          set -euo pipefail
          LOCAL_DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/schema.sql"
          psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -q -c "create schema if not exists supabase_migrations; create table if not exists supabase_migrations.schema_migrations (version text primary key, name text, statements text[]);"
          while read -r v; do
            [ -n "$v" ] && psql "$LOCAL_DB" -q -c "insert into supabase_migrations.schema_migrations (version) values ('$v') on conflict do nothing"
          done < "$RUNNER_TEMP/applied.txt"
          MIGRATE_DB_URL="$LOCAL_DB" MIGRATE_LABEL=private node scripts/migrate.mjs
      - name: Make the QA account and its household
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/local.env"
          curl -sf -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"email_confirm\":true}" > /dev/null
          TOKEN=$(curl -sf -X POST "$API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\"}" | jq -r .access_token)
          curl -sf -X POST "$API_URL/rest/v1/rpc/create_family" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"p_household_name":"QA Private","p_full_name":"Quinn Private"}' > /dev/null
          echo "QA account and household made."
      - run: npm ci
      - name: Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install just the OS packages the cached browser still needs
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build and start against the private database
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/local.env"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" >> "$GITHUB_ENV"
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/login --timeout 120000
      # add-expense.spec.ts writes (an account, an entry, a bill, all named
      # with its RUN and removed after), which is fine on a database that
      # exists for this run and not on shared dev -- so it runs here and in
      # the weekly tier, not in the post-merge smoke above (26 October).
      # popups.spec.ts the same (26 October): the pop-ups open, close on a
      # swipe, go back, save and ask before discarding typed work; its save
      # adds a goal named with its RUN and removes it after.
      # assistant-rules-live.spec.ts (28 October): Ask Kin's rule layer
      # against this run's database -- every tool the rules reach, through
      # POST /api/assistant as the signed-in household, plus a list item and
      # a bill it adds, marks and removes (all named E2E-RULES). The matcher
      # itself is held by the logic spec; this is where its queries are shown
      # to run.
      - name: Run smoke + logic + the Add expense sheet, the pop-ups, and Ask Kin's rules
        run: npx playwright test e2e/smoke.spec.ts e2e/add-expense.spec.ts e2e/popups.spec.ts e2e/assistant-rules-live.spec.ts e2e/*.logic.spec.ts --workers=2
      # Playwright writes an outline of the page as it stood when a test
      # failed (error-context.md: every heading, button, dialog and line of
      # text, with its state). The report artifact holds it, but a Claude
      # session cannot fetch artifacts (its proxy refuses the blob host), so
      # the outline goes into this log too, where anyone can read it
      # (26 October: three runs to learn a sheet never opened).
      - name: What each failing test saw
        if: failure()
        run: |
          for f in test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-private-db
          path: kin/playwright-report/
          retention-days: 7

      # ── Phone-width screenshots on this database (23 October) ───────────
      # The same steps, rules and accept file as in the job above (see its
      # long comment), with one difference: the baseline is main's run of
      # THIS job, `visual-baseline-private`, so an empty household is only
      # ever compared with an empty household.
      - name: Main's screenshots, to compare with
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VISUAL_ARTIFACT: visual-baseline-private
        run: bash scripts/visual-baseline.sh
      - name: Freeze the clock for the screenshots
        run: |
          (sudo apt-get install -y -q faketime >/dev/null 2>&1 || (sudo apt-get update -q >/dev/null && sudo apt-get install -y -q faketime >/dev/null)) && command -v faketime
          if [ "$(date -u +%H)" -ge 22 ]; then day=$(date -u +%F); else day=$(date -u -d yesterday +%F); fi
          echo "VISUAL_FROZEN_AT=$day 22:00:00" >> "$GITHUB_ENV"
          echo "Screenshots at $day 22:00 UTC (06:00 the next morning in Manila)."
      - name: Phone-width screenshots (five screens, Simple Kin off and on)
        env:
          VISUAL_PR: ${{ github.event.pull_request.number }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-visual
        run: npx playwright test e2e/visual.spec.ts --workers=1
      - name: Keep these as main's baseline
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: visual-baseline-private
          path: |
            kin/visual-out/*.png
            kin/visual-out/frozen-at.txt
            !kin/visual-out/*-diff.png
          retention-days: 30
      - name: Before and after, on the pull request
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/visual-comment.sh
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: visual-screenshots
          path: |
            kin/visual-out/
            kin/playwright-report-visual/
          retention-days: 7
