name: Secret Scan

# Runs on every push and PR to catch a committed secret (API key, token,
# credential) before it lands in history. The repo being private is not a
# reason to drop this: a key committed here is still a leaked key the moment
# a collaborator is added, the repo is transferred, or it is sold -- and git
# history is the one place a mistake outlives the commit that made it.
# Fails the run loudly rather than silently allowing the push through.

# Not scoped to `branches: [main]` on pull requests -- see ci.yml for why. A
# stacked pull request skipped this entirely, which means a credential could
# have reached main through one without ever being looked at. That is the
# worst possible check to have silently opted out of.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action asks GitHub which commits belong to the pull request, so
  # that a pull request scans its own range rather than all of history. Without
  # this it gets 403 "Resource not accessible by integration" and fails the
  # run -- which reads exactly like a leaked secret while actually meaning
  # nothing was scanned at all. Push runs never ask, which is why only pull
  # requests broke, and why it went unnoticed.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
