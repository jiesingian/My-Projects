name: CI

# The gate every pull request has to get through before it can be merged --
# automatically or by hand. Without this, "auto-merge once checks pass" would
# mean "merge once nothing has been checked".
# `pull_request` is deliberately not scoped to `branches: [main]`, and neither
# is the secret scan. It was, and that is how #54 reached main on 10 September
# with no typecheck, no lint, no build and no secret scan run against it: it
# was stacked on another branch, so its base was not `main`, so GitHub skipped
# this file entirely. Stacked pull requests are how Janine works -- a second
# change that needs the first -- and the checks have to follow the work rather
# than the other way round.
#
# `push` stays on main only. Every branch here becomes a pull request, so
# building each push as well would double the bill to learn the same thing.
on:
  pull_request:
  push:
    branches: [main]

# Per branch, not global -- schema-check.yml already uses this exact pattern
# safely. Unlike e2e.yml, nothing here writes shared state, so three pushes
# in a minute cancelling the first two outright (rather than letting all
# three run to completion) costs nothing: only the last push before merge
# needs a passing result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read everything, write only pull-request comments: the bundle budget below
# posts its table on the pull request when a route's first-load JS changed.
# Before this block the token had the repository's default, which this makes
# explicit rather than wider; every other step only reads.
permissions:
  contents: read
  pull-requests: write

jobs:
  kin:
    name: kin — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kin/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Row-level security (PGlite)
        # Applies the chat and connections migrations to an in-memory Postgres
        # with stand-in tables and five invented households, then checks who
        # can read and write what. No network, no real database, ~20 seconds.
        run: npm run test:rls

      - name: Every new table has a row-level security probe
        # No new table, view or security-definer function without a probe
        # under kin/supabase/tests/pglite/probes/ that mentions it (20
        # October). #728 and #730 in the stabilisation pass were tables whose
        # policies shipped unprobed: a monito-monita organizer could open
        # every pick early, a child could read a parents-only prescription.
        #
        # Fails only on NEW debt: an object first created by a migration that
        # is on this branch and not on main. Everything that existed on 20
        # October is grandfathered in no-probe-yet.txt, so this passes on
        # main and on every other open pull request; an unprobed object that
        # reaches main without an allowlist line is a warning, never a red
        # main. The script's header has the rules; `--update-allowlist`
        # rewrites the list when a grandfathered entry is added on purpose.
        #
        # `git fetch --depth=1` of the base branch is all it needs: the
        # script compares file names against main's tree, not history, so
        # the checkout above can stay shallow. On a push to main BASE is
        # empty and nothing is new, so it can only warn.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            node scripts/check-rls-probes.mjs --base "origin/$BASE"
          else
            node scripts/check-rls-probes.mjs
          fi

      - name: Help says what the screens do
        # Settings -> Help (kin/src/lib/help-guide.ts) describes every feature.
        # In the week to 28 October about fifty pull requests changed screens
        # and none touched it, so Help described an app that no longer
        # existed until #1069 caught it up by hand. A warning, never a red
        # check: plenty of screen changes say nothing new to a family (a
        # layout fix, a rename inside the code). It lists the screens so the
        # author decides; the ship skill asks the same before opening.
        #
        # On a pull request the checkout is GitHub's merge commit, so its
        # diff against the base branch's tip is exactly this PR's change.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE" HEAD -- 'src/app/(app)/' src/components/ | grep -E '\.tsx$' || true)
          if [ -n "$changed" ] && git diff --quiet "origin/$BASE" HEAD -- src/lib/help-guide.ts; then
            echo "::warning title=Help not updated::Screens changed but src/lib/help-guide.ts did not. If a family would notice the change, update its Help entry in this PR. Changed: $(echo $changed)"
          fi

      - name: Build
        # Every page in Kin is server-rendered on demand, so nothing is
        # prerendered and no real database is touched here. The placeholders
        # only satisfy the client constructor at build time -- they are not
        # secrets and are not the project's real values.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
        run: npm run build

      - name: Client bundle budget
        # What a phone downloads before each page is usable, per route,
        # against kin/bundle-baseline.json (20 October). #710 took the shell
        # from 247 KB to 176 KB by keeping supabase-js out of the layouts;
        # one innocent import at the top of a layout would put it back on
        # every page, and nothing else here would notice. A route may grow by
        # 10% or 25 KB, whichever is larger; more than that fails, with the
        # one-line fix in the message (`npm run bundle:baseline` in kin/, in
        # the same pull request, saying why). A route the baseline does not
        # have yet is reported, not failed. The script's header has the rest.
        id: bundle
        run: node scripts/bundle-budget.mjs --report "$RUNNER_TEMP/bundle-report.md"

      - name: Say the numbers on the pull request, only when they changed
        # One comment per pull request, edited in place on later pushes, and
        # only when some route moved by a kilobyte or more (or went over). A
        # pull request that leaves the bundles alone gets no comment at all.
        # `|| true` throughout: a comment that could not be posted (a fork's
        # read-only token, the API being slow) must never fail the build.
        if: ${{ always() && github.event_name == 'pull_request' && steps.bundle.outcome != 'skipped' && steps.bundle.outcome != 'cancelled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ steps.bundle.outputs.changed }}
          OVER: ${{ steps.bundle.outputs.over }}
        run: |
          set -uo pipefail
          MARK="<!-- bundle-budget -->"
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" 2>/dev/null | head -1 || true)
          if [ "$CHANGED" != "true" ] && [ -z "$EXISTING" ]; then
            echo "Nothing changed by a kilobyte; no comment."
            exit 0
          fi
          if [ "$CHANGED" = "true" ] && [ -f "$RUNNER_TEMP/bundle-report.md" ]; then
            if [ "$OVER" = "true" ]; then HEAD="### Bundle budget: over"; else HEAD="### Bundle budget: changed"; fi
            BODY=$(printf '%s\n%s\n\n%s\n' "$MARK" "$HEAD" "$(cat "$RUNNER_TEMP/bundle-report.md")")
          else
            BODY=$(printf '%s\n### Bundle budget: back to the baseline\n\nThe latest push changes no route by a kilobyte or more.\n' "$MARK")
          fi
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null && echo "Updated the comment." || echo "Could not update the comment (not fatal)."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null && echo "Posted the comment." || echo "Could not post the comment (not fatal)."
          fi
