name: Triage

# Decides whether a pull request may merge itself once CI is green, or has to
# wait for Jonathan.
#
# The decision is made from the diff, never from what the author says about it.
# An agent asked to describe its own change will describe it as small, and the
# whole point of this file is that nobody -- person or model -- gets to grade
# their own homework.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both labels below are applied with "|| true", so a repository that has
      # never had them just logged "'auto-merge' not found" and carried on
      # labelling nothing. Creating them here keeps that from being a silent
      # no-op without needing anyone to set the repository up by hand.
      - name: Make sure the labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "auto-merge" --repo "$REPO" --color 0E8A16 \
            --description "Small and clear of the sensitive paths; merges on green." || true
          gh label create "needs-jonathan" --repo "$REPO" --color D93F0B \
            --description "Waits for Jonathan: expensive to undo, or too large to merge unseen." || true

      - name: Work out whether this needs Jonathan
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: jiesingian
        run: |
          set -euo pipefail

          # The test is not "does this look risky" but "could we undo it in
          # five minutes". Code is revertible: a bad component ships, we notice,
          # we revert. These are the things that are not -- the way into the
          # app, who may see whose data, money, and anything that runs code on
          # our machines. A leak is leaked and a dropped column is gone.
          #
          # Everything else, including most server actions, merges on green and
          # is fixed forward. RLS is the real backstop under the actions, and it
          # is enforced by the database rather than by whoever read the diff.
          #
          # .claude/ is here because it is the most literal reading of "runs
          # code on our machines" in the whole list: settings.json registers
          # the SessionStart hook and holds the permission allowlist, so a
          # ten-line diff there can add a hook or widen a grant, and the next
          # session on anyone's machine runs it without asking. It was invisible
          # to this classifier until recently for the honest reason that it
          # could not appear in a diff at all -- it was gitignored. The moment
          # it became committable, it needed watching, and that was missed.
          # .gitignore is here for the same reason: it decides what this list
          # can even see.
          SENSITIVE='^(
          kin/src/lib/actions/(auth|family|billing|wealth|drive)\.ts|
          kin/src/lib/supabase/|
          kin/src/lib/session\.ts|
          kin/src/lib/access\.ts|
          kin/src/lib/billing/|
          kin/src/proxy\.ts|
          kin/src/app/api/|
          kin/src/app/auth/|
          kin/src/app/login/|
          kin/src/app/signup/|
          kin/src/app/verify/|
          kin/src/app/forgot-password/|
          kin/src/app/reset-password/|
          kin/src/app/subscribe/|
          kin/next\.config\.|
          kin/package(-lock)?\.json|
          kin/eslint\.config\.|
          \.github/|
          \.claude/|
          \.gitignore|
          CLAUDE\.md|
          .*AGENTS\.md|
          LICENSE|
          .*\.sql
          )'
          SENSITIVE=$(printf '%s' "$SENSITIVE" | tr -d ' \n')

          gh pr diff "$PR" --repo "$REPO" --name-only > /tmp/files.txt
          echo "Files changed:"; cat /tmp/files.txt

          REASON=""

          # Whose pull request it is comes first, and outranks everything
          # below. Jonathan pushes to main directly, so a pull request in his
          # name is his own work arriving by another door, and the tests are
          # the only gate it needs. Everyone else's waits for him, whatever
          # the diff looks like. That is a decision about who approves rather
          # than about how risky a change looks, which is why it sits above
          # the classifier instead of inside it -- and the classifier still
          # runs, so a held pull request says everything true about itself.
          if [ "$AUTHOR" != "$OWNER" ]; then
            REASON="it is $AUTHOR's, and every change from anyone but Jonathan waits for him"
          fi

          if [ -z "$REASON" ] && grep -qE "$SENSITIVE" /tmp/files.txt; then
            REASON="it touches auth, data rules, billing, an API route, or the toolchain"
          fi

          # Size is the second signal. A large diff may be entirely harmless,
          # but "large and unreviewed" is not a combination worth having.
          ADDED=$(gh pr view "$PR" --repo "$REPO" --json additions --jq .additions)
          DELETED=$(gh pr view "$PR" --repo "$REPO" --json deletions --jq .deletions)
          TOTAL=$(( ADDED + DELETED ))
          echo "Lines changed: $TOTAL"
          if [ "$TOTAL" -gt 400 ] && [ -z "$REASON" ]; then
            REASON="it changes $TOTAL lines, which is past the point of merging unseen"
          fi

          if [ -n "$REASON" ]; then
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          else
            echo "needs_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hold it for review
        if: steps.triage.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.triage.outputs.reason }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --add-label "needs-jonathan" --remove-label "auto-merge" || true
          # Disables any auto-merge a previous, smaller push may have armed.
          gh pr merge "$PR" --repo "$REPO" --disable-auto || true
          gh pr comment "$PR" --repo "$REPO" --body \
            "**Held for review** — $REASON.

          This one waits for Jonathan. Nothing is wrong with it; it is just in territory where a mistake is expensive, so it gets read before it ships."

      - name: Mark it as mergeable on green
        if: steps.triage.outputs.needs_review == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # This step no longer merges anything. It only says the change is
          # small and clear of the sensitive paths; automerge.yml does the
          # merging, once CI has actually finished and passed.
          #
          # It used to call `gh pr merge --auto`, which twice put a pull
          # request into main seconds after it opened, while CI was still
          # running. "--auto" waits only when a branch rule requires a check,
          # and this repository has no such rule: branch rulesets are a paid
          # feature on private repositories, so making the repository private
          # turned protection off without saying so. The guard added to catch
          # that asked the rules API, got a 403 telling it to upgrade, and --
          # because gh writes that error to stdout -- compared the JSON to a
          # number, which is not false, so it merged anyway. A guard that
          # fails open is worse than no guard.
          #
          # So nothing here asks what the plan allows. automerge.yml asks the
          # only question that matters and that every plan can answer: did the
          # checks finish, and did they pass.
          gh pr edit "$PR" --repo "$REPO" --add-label "auto-merge" --remove-label "needs-jonathan" || true
