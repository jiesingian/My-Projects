name: Auto-merge

# Merges a pull request that triage judged small, but only once the checks
# have actually finished and passed.
#
# This exists because "merge when green" turned out to be the hard part.
# `gh pr merge --auto` delegates the waiting to GitHub, and GitHub only waits
# when a branch rule requires a check. On a private repository on the Free
# plan there can be no such rule -- the rules API answers 403, "Upgrade to
# GitHub Pro or make this repository public" -- so --auto degraded to "merge
# now", and twice put a change into main while CI was still running.
#
# Nothing here asks what the plan allows. It waits for a check suite to
# finish, then reads everything that has reported on that commit -- check runs
# and commit statuses both -- and merges only if every one of them passed.
# That question has the same answer on every plan.
on:
  workflow_run:
    # Whichever finishes last does the merging; the others find a check still
    # running and stop, which is why all three are listed. End-to-end was
    # missing, and it is the slow one -- about eight minutes against one for
    # the others -- so on any pull request touching kin/src it always finished
    # last, and its completion woke nothing. Those pull requests simply never
    # merged.
    workflows: [CI, Secret Scan, End-to-end]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  # The Vercel deployment is read through the older Statuses API rather than
  # as a check run, and a permissions block sets every scope it does not list
  # to none -- so that read was a 403 and the job died before merging
  # anything. It failed on the line after the one that prints the check-run
  # tally, which is why the log looks like the checks were the problem.
  statuses: read

jobs:
  merge:
    # A failed suite never reaches the merge, and a run that was not for a
    # pull request has nothing to merge.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge if the whole commit is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No pull request for $SHA — nothing to do."; exit 0
          fi

          STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR is $STATE — nothing to do."; exit 0
          fi

          # There is deliberately no "held for review" check here any more.
          # Until 10 September a "needs-jonathan" label stopped this job dead,
          # which is a manual approval gate however it is spelled, and the rule
          # now is that nothing waits on a person. A change in expensive
          # territory is labelled "watched" and commented on by triage.yml, and
          # then merges on green like anything else; watched-change.yml opens
          # an issue for it once it lands, so it is recorded either way.
          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if ! echo "$LABELS" | grep -qx "auto-merge"; then
            echo "PR #$PR is not marked auto-merge — leaving it alone."; exit 0
          fi

          # Every check run on this commit must have finished and passed.
          # Anything still running means the other workflow is not done yet;
          # its own completion will bring us back here.
          gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" > /tmp/checks.json
          PENDING=$(jq '[.check_runs[] | select(.status != "completed")] | length' /tmp/checks.json)
          FAILED=$(jq '[.check_runs[]
                        | select(.status == "completed")
                        | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")
                       ] | length' /tmp/checks.json)
          TOTAL=$(jq '.check_runs | length' /tmp/checks.json)

          # No check runs at all would mean nothing was verified, so refuse.
          if [ "$TOTAL" -eq 0 ]; then
            echo "No check runs on $SHA — refusing to merge something unverified."; exit 0
          fi

          echo "check runs on $SHA — total: $TOTAL, pending: $PENDING, failed: $FAILED"

          if [ "$PENDING" -ne 0 ]; then
            echo "Still running. The other workflow's completion will retry."; exit 0
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "Something failed. Not merging."; exit 0
          fi

          # Check runs are only half of what reports on a commit. Vercel posts
          # its deployment through the older Statuses API instead -- verified:
          # the combined status on the head of #7 is one entry, context
          # "Vercel", "Deployment has completed". Reading only check runs meant
          # a failed deployment did not block a merge, which is the wrong way
          # for this gate to be wrong.
          #
          # The combined state is "success" only when every status succeeded,
          # "pending" while any is unfinished, and "failure"/"error" otherwise.
          # A commit nothing has posted a status for reports "pending" with a
          # count of zero, which means nothing to wait for rather than
          # something unfinished.
          gh api "repos/$REPO/commits/$SHA/status" > /tmp/status.json
          ST_COUNT=$(jq '.total_count' /tmp/status.json)
          ST_STATE=$(jq -r '.state' /tmp/status.json)
          echo "commit statuses on $SHA — count: $ST_COUNT, state: $ST_STATE"

          if [ "$ST_COUNT" -ne 0 ]; then
            if [ "$ST_STATE" = "pending" ]; then
              echo "A commit status is still pending. Not merging yet."; exit 0
            fi
            if [ "$ST_STATE" != "success" ]; then
              echo "A commit status reported $ST_STATE. Not merging."; exit 0
            fi
          fi

          # --match-head-commit refuses if anything was pushed since the checks
          # ran, so a green result can never merge a commit it did not test.
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
          echo "Merged PR #$PR at $SHA."
