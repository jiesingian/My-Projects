name: Auto-merge

# Merges a pull request that triage judged small, but only once the checks
# have actually finished and passed.
#
# This exists because "merge when green" turned out to be the hard part.
# `gh pr merge --auto` delegates the waiting to GitHub, and GitHub only waits
# when a branch rule requires a check. On a private repository on the Free
# plan there can be no such rule -- the rules API answers 403, "Upgrade to
# GitHub Pro or make this repository public" -- so --auto degraded to "merge
# now", and twice put a change into main while CI was still running.
#
# Nothing here asks what the plan allows. It waits for a check suite to
# finish, then reads everything that has reported on that commit -- check runs
# and commit statuses both -- and merges only if every one of them passed.
# That question has the same answer on every plan.
on:
  workflow_run:
    # Whichever finishes last does the merging; the others find a check still
    # running and stop, which is why every workflow that posts a check run on
    # a pull request commit has to be listed.
    #
    # This list has now been wrong twice, the same way. End-to-end was missing
    # first: it is the slow one, about eight minutes against one for the
    # others, so on any pull request touching kin/src it always finished last
    # and its completion woke nothing. Schema check was missing second, and
    # that is what stranded #50 -- its first attempt failed on clock skew
    # (PGRST303), it was re-run and went green at 09:46, and by then CI and
    # Secret Scan were an hour past reporting. Every check on the commit
    # passed and nothing was left to wake this job. The pull request sat
    # green, mergeable and unmerged until somebody noticed.
    #
    # Triage is deliberately not here. It runs on pull_request_target, so its
    # workflow_run carries the base branch's SHA rather than the pull
    # request's, and this job would look up the wrong commit. It is also the
    # fastest thing in the repository and has never finished last.
    workflows: [CI, Secret Scan, End-to-end, Schema check]
    types: [completed]

  # The list above will go stale again -- the next workflow anybody adds will
  # not be in it, and nobody will notice until a pull request sits unmerged.
  # So the events are no longer the only way in. This sweeps every open pull
  # request labelled auto-merge and applies exactly the same test, so a missed
  # event costs a wait rather than costing the merge entirely.
  #
  # HOW LONG A WAIT, HONESTLY. The cron below says every fifteen minutes and
  # GitHub does not honour it. Measured on 13-14 September, the actual firings
  # were 21:11, 23:07 and 01:00 -- roughly every two hours. Scheduled
  # workflows are best-effort on shared runners and frequent schedules get
  # throttled; asking for */5 would not help.
  #
  # That is still worth having -- a slow backstop beats none, and the events
  # remain the fast path -- but it is a backstop, not a fifteen-minute
  # guarantee, and this comment said otherwise until somebody read the run
  # history. If a pull request is sitting green and unmerged, do not wait on
  # this: re-run any workflow in the list above, or dispatch this one.
  #
  # It also covers the other blind spot events have: a label added after the
  # checks have finished. Labelling is not a workflow_run, so a pull request
  # that becomes eligible late used to wait for a push that might never come.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  # Reading which WORKFLOWS ran on a commit -- the check added on 14 September
  # that refuses to merge when a required one never started -- goes through
  # the Actions API, and a permissions block sets every scope it does not
  # list to none. Without this line `gh api repos/../actions/runs` answers
  #
  #   gh: Resource not accessible by integration (HTTP 403)
  #
  # and the job dies before merging anything. Which is precisely the failure
  # described four paragraphs above, about `statuses` -- the same block, the
  # same 403, the same dead job, four days later and one scope over. Read
  # that comment before adding anything else to this file that calls an API.
  actions: read
  # The Vercel deployment is read through the older Statuses API rather than
  # as a check run, and a permissions block sets every scope it does not list
  # to none -- so that read was a 403 and the job died before merging
  # anything. It failed on the line after the one that prints the check-run
  # tally, which is why the log looks like the checks were the problem.
  statuses: read

# One merger at a time. Two runs reading the same pull request would both see
# green and both call merge; the second would fail on an already-merged pull
# request and paint this job red for no reason.
concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    # A failed suite never reaches the merge, and a run that was not for a
    # pull request has nothing to merge. The sweep and a manual dispatch carry
    # no workflow_run at all and are always allowed through.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Merge whatever is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Decide whether one pull request is green, and merge it if so.
          # Returns rather than exits: the sweep considers several in a row,
          # and one that is not ready must not stop the ones after it.
          consider() {
            local PR="$1" SHA STATE LABELS PENDING FAILED TOTAL ST_COUNT ST_STATE

            STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            if [ "$STATE" != "OPEN" ]; then
              echo "PR #$PR is $STATE — nothing to do."; return 0
            fi

            # There is deliberately no "held for review" check here any more.
            # Until 10 September a "needs-jonathan" label stopped this job
            # dead, which is a manual approval gate however it is spelled, and
            # the rule now is that nothing waits on a person. A change in
            # expensive territory is labelled "watched" and commented on by
            # triage.yml, and then merges on green like anything else;
            # watched-change.yml opens an issue for it once it lands, so it is
            # recorded either way.
            LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
            if ! echo "$LABELS" | grep -qx "auto-merge"; then
              echo "PR #$PR is not marked auto-merge — leaving it alone."; return 0
            fi

            # Always the pull request's current head, never the SHA that woke
            # this job: on the sweep there is no such SHA, and on an event a
            # push may have landed since. --match-head-commit below refuses
            # anything that moved after this read.
            SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)

            # The checks that matter must have RUN, not merely not-failed.
            #
            # This is the hole that let #54 through on 10 September, and it is
            # the same shape as the bug fixed in check-schema.mjs hours
            # earlier: "nothing reported a failure" is not "everything passed"
            # when nothing reported at all. #54 was force-pushed to a new head,
            # only Triage ran on it, and this job merged a change to
            # lib/actions/wealth.ts on the strength of two check runs -- a
            # label classifier and a Vercel comment. Production then spent
            # three days without a column that main's code writes on every
            # asset edit.
            #
            # Listing workflow names rather than check-run names deliberately:
            # a job renamed inside a workflow silently empties a check-run
            # list, and this must fail loudly rather than quietly stop
            # requiring something.
            gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > /tmp/runs.json

            ran() { jq -r --arg n "$1" '[.workflow_runs[] | select(.name==$n)] | length' /tmp/runs.json; }
            passed() { jq -r --arg n "$1" '[.workflow_runs[] | select(.name==$n) | select(.conclusion=="success")] | length' /tmp/runs.json; }

            REQUIRED="CI|Secret Scan|Schema check"

            # End-to-end is required only where it applies -- it is path
            # filtered, so demanding it on a documentation change would stall
            # that change forever waiting for a run that will never start.
            gh pr diff "$PR" --repo "$REPO" --name-only > /tmp/files.txt
            if grep -qE '^(kin/src/|kin/e2e/|kin/package(-lock)?\.json|kin/playwright\.config\.ts|\.github/workflows/e2e\.yml)' /tmp/files.txt; then
              REQUIRED="$REQUIRED|End-to-end"
            fi

            # Newline separated, and read as whole lines. Two of these four
            # names contain a space, and the first version of this loop was
            #
            #     for W in $(echo "$REQUIRED" | tr '|' ' ')
            #
            # which splits on whitespace, so "Secret Scan" became "Secret" and
            # "Scan" and "Schema check" became "Schema" and "check". None of
            # those is a workflow, all four were therefore "never ran", and
            # this job refused every pull request it was ever asked about --
            # from the moment the required-checks test was added until now.
            # That is why it has merged nothing while PRs were merged by hand
            # around it.
            #
            # The separate logging loop that used to sit above this one read
            # the names correctly, which is what made the bug findable: the log
            # said "Secret Scan (runs: 1, passed: 1)" and then
            # "Secret(never ran) Scan(never ran)" three lines later. Logging
            # and checking are one loop now so they cannot disagree again.
            MISSING=""
            while IFS= read -r W; do
              [ -n "$W" ] || continue
              echo "PR #$PR — required: $W (runs: $(ran "$W"), passed: $(passed "$W"))"
              if [ "$(ran "$W")" -eq 0 ]; then MISSING="$MISSING [$W: never ran]"; continue; fi
              if [ "$(passed "$W")" -eq 0 ]; then MISSING="$MISSING [$W: not green]"; fi
            done <<< "$(echo "$REQUIRED" | tr '|' '\n')"
            if [ -n "$MISSING" ]; then
              echo "PR #$PR: not merging —$MISSING."
              echo "A check that did not run is not a check that passed."
              return 0
            fi

            # Everything else that reported must also be green. The required
            # list above is the floor, not the ceiling: Vercel, Triage and
            # anything added later still count.
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" > /tmp/checks.raw.json

            # Drop this job's own check run before counting.
            #
            # On the ordinary paths -- workflow_run and the cron sweep -- this
            # job runs against main, so it posts its check run on main's head
            # and never appears on a pull request commit. Dispatched against
            # the pull request's own branch it does, and then it counts itself
            # as the one thing still pending and refuses, every time, forever.
            #
            # That matters because dispatching this workflow is exactly what
            # the comment at the top of the file tells you to do when a pull
            # request is sitting green and unmerged. Following that advice
            # against the branch could not have worked.
            #
            # Matched on the run id in the URL, so it excludes this run and
            # nothing else -- not an earlier attempt, not another workflow
            # that happens to have a job called "merge".
            jq --arg run "${GITHUB_RUN_ID}" \
              '.check_runs |= map(select(((.details_url // "") | contains("/actions/runs/" + $run + "/")) | not))' \
              /tmp/checks.raw.json > /tmp/checks.json

            SELF=$(( $(jq '.check_runs | length' /tmp/checks.raw.json) - $(jq '.check_runs | length' /tmp/checks.json) ))
            if [ "$SELF" -ne 0 ]; then
              echo "PR #$PR — ignoring $SELF check run(s) posted by this job itself."
            fi

            PENDING=$(jq '[.check_runs[] | select(.status != "completed")] | length' /tmp/checks.json)
            FAILED=$(jq '[.check_runs[]
                          | select(.status == "completed")
                          | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")
                         ] | length' /tmp/checks.json)
            TOTAL=$(jq '.check_runs | length' /tmp/checks.json)

            # No check runs at all would mean nothing was verified, so refuse.
            if [ "$TOTAL" -eq 0 ]; then
              echo "PR #$PR: no check runs on $SHA — refusing to merge something unverified."; return 0
            fi

            echo "PR #$PR — check runs on $SHA: total $TOTAL, pending $PENDING, failed $FAILED"

            if [ "$PENDING" -ne 0 ]; then
              echo "PR #$PR: still running. A later completion or the next sweep will retry."; return 0
            fi
            if [ "$FAILED" -ne 0 ]; then
              echo "PR #$PR: something failed. Not merging."; return 0
            fi

            # Check runs are only half of what reports on a commit. Vercel
            # posts its deployment through the older Statuses API instead --
            # verified: the combined status on the head of #7 is one entry,
            # context "Vercel", "Deployment has completed". Reading only check
            # runs meant a failed deployment did not block a merge, which is
            # the wrong way for this gate to be wrong.
            #
            # The combined state is "success" only when every status
            # succeeded, "pending" while any is unfinished, and
            # "failure"/"error" otherwise. A commit nothing has posted a
            # status for reports "pending" with a count of zero, which means
            # nothing to wait for rather than something unfinished.
            gh api "repos/$REPO/commits/$SHA/status" > /tmp/status.json
            ST_COUNT=$(jq '.total_count' /tmp/status.json)
            ST_STATE=$(jq -r '.state' /tmp/status.json)
            echo "PR #$PR — commit statuses on $SHA: count $ST_COUNT, state $ST_STATE"

            if [ "$ST_COUNT" -ne 0 ]; then
              if [ "$ST_STATE" = "pending" ]; then
                echo "PR #$PR: a commit status is still pending. Not merging yet."; return 0
              fi
              if [ "$ST_STATE" != "success" ]; then
                echo "PR #$PR: a commit status reported $ST_STATE. Not merging."; return 0
              fi
            fi

            # --match-head-commit refuses if anything was pushed since the
            # checks ran, so a green result can never merge a commit it did
            # not test. A conflict makes this fail, which is correct and
            # visible; it does not stop the sweep looking at the others.
            if gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"; then
              echo "Merged PR #$PR at $SHA."

              # GitHub does not start workflows from a push made with
              # GITHUB_TOKEN, and this job merges with exactly that. So the
              # moment auto-merge began working on 10 September, every
              # post-merge check on main went dark without a word:
              # watched-change.yml has not opened an issue since 08:51 that
              # day, and neither schema-check nor the end-to-end suite has run
              # against main since. The gate got fixed and the net switched
              # off in the same hour.
              #
              # workflow_dispatch is not suppressed the way push is, so the
              # merge asks for them by name instead. Each is "|| true": a
              # failure to start one of these must never look like a failure
              # to merge, which has already happened.
              for W in watched-change.yml schema-check.yml e2e.yml; do
                gh workflow run "$W" --repo "$REPO" --ref main \
                  && echo "  woke $W on main" \
                  || echo "  could not wake $W — run it by hand if it matters"
              done
            else
              echo "PR #$PR: merge refused — conflict, or the head moved. Leaving it."
            fi
          }

          if [ "$EVENT" = "workflow_run" ]; then
            # One pull request: the one whose commit the finished run was for.
            PRS=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].number')
            if [ -z "$PRS" ]; then
              echo "No pull request for $SHA — nothing to do."; exit 0
            fi
          else
            # The sweep: everything currently eligible, whatever woke it.
            PRS=$(gh pr list --repo "$REPO" --state open --label auto-merge --json number --jq '.[].number')
            if [ -z "$PRS" ]; then
              echo "No open pull request is marked auto-merge — nothing to do."; exit 0
            fi
            echo "Sweeping: $(echo "$PRS" | tr '\n' ' ')"
          fi

          for PR in $PRS; do consider "$PR"; done
