name: Daily check

# One result a day, instead of two people watching each other's pushes.
#
# The automatic checks on each pull request are the gate -- nothing merges
# without them. This is the different thing: a check of the whole setup
# against `main` as it actually stands, once a day, at an hour somebody is
# awake to read it.
#
# It exists because some failures cannot be caught by a pull request at all:
#
#   - A migration written, merged, and never run. The code and the database
#     drift apart with every check green, which is exactly what broke Settings
#     and Add account in front of a person on 9 September.
#   - Fixtures ageing out. This was a real risk rather than a hypothetical:
#     `regressions.spec` used to assert against activities somebody had seeded
#     by hand, dated Monday 7 September, and from Monday the 14th they fell
#     outside the week the Planner shows. It was rewritten to make its own,
#     anchored to today, and passed on the 14th with nothing to fix -- but the
#     class is what this line is for, and the next hand-seeded fixture will do
#     the same thing on its own schedule.
#   - A dependency, a Supabase change, or an expiring credential. Nobody pushes
#     anything and `main` stops working anyway.
#
# WHEN THIS ACTUALLY RUNS, which is not what the cron says.
#
# 09:00 UTC would be 17:00 in Manila. It has never once fired then. Measured
# from this workflow's own run history:
#
#   asked 09:00 UTC   fired 11 Sep 13:10 UTC   21:10 Manila
#   asked 09:00 UTC   fired 12 Sep 12:34 UTC   20:34 Manila
#   asked 09:00 UTC   fired 13 Sep 13:35 UTC   21:35 Manila
#
# Three and a half to four and a half hours late, varying by an hour between
# days. GitHub's scheduled workflows are best-effort on shared runners and the
# documentation says so; there is no queue to jump and no setting to change.
# Moving the cron earlier would only aim at a target that moves.
#
# So what this is, honestly: once a day, some time in the Manila evening,
# silent unless something broke. That is still the thing it was built for --
# one result to read rather than two people watching each other's pushes --
# but the fixed hour was never real, and a time written in a comment is what
# somebody plans their evening around. If a dependable hour is ever needed,
# it has to be triggered by something that keeps time, not by this cron.
#
# WHAT IT ACTUALLY RUNS, changed 18 September to stop burning a private
# repo's whole monthly Actions allowance on one redundant re-run a day.
#
# Typecheck, lint, build and the Schema step are untouched -- Schema is
# exactly the check that would have caught the 9 September migrations, and
# it costs about a minute regardless. What changed is the end-to-end step:
# it used to run the entire suite (`npm run e2e`, ~13 minutes with the
# browser install), which is largely re-proving what e2e.yml already proved
# at the last merge to main. It now runs two files instead of all thirty:
#
#   - smoke.spec.ts: every hub, every width, every theme, checking the page
#     loads clean -- this is what actually catches reason three above (a
#     dependency, a Supabase change, an expired credential), since any of
#     those show up as a page that will not render.
#   - regressions.spec.ts: named "bugs that already got out once" for a
#     reason -- this is reason two, fixtures ageing out, in the one file
#     that class of bug has actually hit.
#
# A logic bug specific to one form or one calculation, the kind the full
# suite's other twenty-eight files exist for, is not what a day with no
# push is trying to catch -- e2e.yml already ran the whole thing against
# that exact code the moment it merged. What is left uncaught by this
# narrower daily run is a regression that both landed unnoticed at merge
# time AND only shows up in a spec outside these two files AND needs no
# code change to surface later -- a narrow enough intersection that the
# ~11 minutes saved on every one of the other days is the better trade.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# The suite writes into the shared throwaway household, so this must queue
# behind any other run rather than race it. Same group as e2e.yml on purpose.
# Not cancel-in-progress: a cancelled suite can leave a preference it meant to
# restore.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  check:
    name: the whole setup, against main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kin/package-lock.json

      - name: Check the secrets are present
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EMAIL: ${{ secrets.E2E_EMAIL }}
          PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$ANON" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "$EMAIL" ] || missing="$missing E2E_EMAIL"
          [ -n "$PASSWORD" ] || missing="$missing E2E_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"; exit 1
          fi

      - run: npm ci
        working-directory: kin

      # Each step records its own verdict rather than stopping the run, so one
      # failure does not hide the state of everything after it. A day where
      # three things broke should say three things broke.
      - name: Typecheck
        id: tsc
        if: always()
        working-directory: kin
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        if: always()
        working-directory: kin
        run: npm run lint

      # NEXT_PUBLIC_* is inlined at build time, so the build that the suite
      # then runs against has to be given them here or the app comes up
      # pointing at nothing.
      - name: Build
        id: build
        if: always()
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # Does the database have what the code believes in? The check that would
      # have caught the three unrun migrations.
      #
      # PROD_* belongs here and its absence cost three days. This step was
      # written before dev existed, when the only credentials there were WERE
      # production's. After the split on 10 September the same four names meant
      # dev, so this check quietly stopped looking at production -- while its
      # own header still said it was the thing that would have caught an unrun
      # migration.
      #
      # It then passed on the 11th, 12th and 13th with main's code writing
      # assets.updated_at and production having no such column, because dev did
      # have it. The one failure this file names in its own opening comment is
      # the one it was blind to.
      - name: Schema
        id: schema
        if: always()
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_E2E_EMAIL: ${{ secrets.PROD_E2E_EMAIL }}
          PROD_E2E_PASSWORD: ${{ secrets.PROD_E2E_PASSWORD }}
        run: node scripts/check-schema.mjs

      # Caches only the browser binary, not the OS packages `--with-deps`
      # installs -- Playwright has no cache for those, and apt is fast enough
      # that it is not worth the risk of a stale system library. Keyed on the
      # exact installed version so a Playwright upgrade gets a fresh browser
      # rather than an incompatible cached one.
      - name: Playwright version
        if: always()
        id: pw-version
        working-directory: kin
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: always()
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install the browser
        if: always() && steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: kin
        run: npx playwright install --with-deps chromium

      - name: Install just the OS packages the cached browser still needs
        if: always() && steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: kin
        run: npx playwright install-deps chromium

      - name: Start the app
        if: always()
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run start &
          npx wait-on http://localhost:3000/login --timeout 120000

      # The Supabase values belong here as well as on the build, for the same
      # reason e2e.yml spells them out twice: locally playwright.config.ts
      # reads them from .env.local, so the specs that talk to PostgREST
      # directly always had them. CI has no .env.local, and without these
      # twelve tests call test.skip() and the run goes green having checked
      # none of them.
      #
      # Two files, not the whole suite -- see the comment at the top of this
      # file for why. E2E_DELETE_* is left out on purpose: delete-household.spec
      # is not in this pair, so those two secrets would go unused here.
      - name: The suite (smoke + regressions, not everything)
        id: e2e
        if: always()
        working-directory: kin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/smoke.spec.ts e2e/regressions.spec.ts

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daily-playwright-report
          path: kin/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # Silence on a good day is the point. Nobody wants an issue every
      # morning saying nothing happened -- that is the notification everybody
      # learns to swipe away, and then the one that matters goes with it.
      # A green run leaves its green tick in Actions and says nothing.
      - name: Say what broke
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TSC: ${{ steps.tsc.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Manila date +%Y-%m-%d)

          {
            echo "The daily check found something on \`main\`. Nobody pushed it there today"
            echo "necessarily — this runs against main as it stands, so a failure here can"
            echo "mean the database moved, a fixture aged out, or a credential expired,"
            echo "as easily as it can mean a bad commit."
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Typecheck | $TSC |"
            echo "| Lint | $LINT |"
            echo "| Build | $BUILD |"
            echo "| Schema | $SCHEMA |"
            echo "| End-to-end (smoke + regressions) | $E2E |"
            echo
            echo "[The run, with the logs and the Playwright report]($RUN_URL)"
            echo
            echo "If **Schema** is the one that failed, it is almost always a migration"
            echo "that has not been run against one of the two databases. The pipeline"
            echo "applies them: \`kin/supabase/migrations/\` holds them, dev takes them on"
            echo "merge, and production takes them when Jonathan runs the **Migrate**"
            echo "workflow. The failure names which database is behind."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/body.md

          # One issue per bad day, reopened rather than duplicated if the same
          # day fails twice (a manual re-run after a fix, say).
          EXISTING=$(gh issue list --repo "$REPO" --label "daily-check" --state open \
            --search "Daily check — $TODAY in:title" --json number --jq '.[0].number // empty')

          gh label create "daily-check" --repo "$REPO" --color B60205 \
            --description "The daily run of the whole setup found something." || true

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/body.md
          else
            gh issue create --repo "$REPO" \
              --title "Daily check — $TODAY" \
              --label "daily-check" \
              --body-file /tmp/body.md
          fi
