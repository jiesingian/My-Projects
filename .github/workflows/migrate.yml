name: Migrate

# Runs the migrations in kin/supabase/migrations that a database has not run
# yet. Both databases do it by themselves once a pull request goes green and
# merges: dev first, then production, and production only if dev took it.
#
# Until 10 September every migration was pasted into the Supabase SQL editor by
# hand -- thirteen of them in four days -- and the record of what had actually
# run lived in a comment at the top of the file saying "NOT YET APPLIED", which
# somebody had to remember to change afterwards. Twice it was not changed:
# #50 corrected one, and the three migrations merged-and-never-run on
# 9 September broke Settings and Add account in front of a person.
#
# Production became a button instead of a copy-paste, which fixed the pasting
# and left the forgetting exactly where it was. On 21 September it was
# forgotten again, and the shape of that failure is worth keeping written
# down: the liquid intake tracker merged, deployed, and sat in the app in
# front of the family unable to save a single glass, because the table it
# needs existed only in the code. Nothing was broken. Nothing was red except
# a schema check that had been correct all along, on every open pull request,
# for hours.
#
# A step a person has to remember is not a safety measure, it is a slower
# failure. So the gate moved to where it can actually catch something: dev
# runs the migration first, minutes earlier, on a synthetic household where a
# bad one costs a rebuild -- and production refuses to start unless that
# worked. A migration still only reaches either database from main, after
# every check went green, which is what merging means here.
on:
  push:
    branches: [main]
    paths:
      - "kin/supabase/migrations/**"
      - "kin/scripts/migrate.mjs"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which database"
        required: true
        default: both
        type: choice
        # `both` is what a merge asks for: dev first, then production only if
        # dev took it cleanly. The single-database options stay for putting
        # one of them right by hand when they have drifted apart.
        options: [both, dev, production]
      dry_run:
        description: "List what would run, and stop"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never two at once, and never cancel one that has started -- a migration
# killed halfway is the one outcome worth more than the runner minutes.
# cancel-in-progress is false for exactly that reason.
concurrency:
  # One group for every target, not one per target. Two runs aimed at
  # different databases used to be free to overlap, and now that a single run
  # carries dev *and* production, an overlapping pair could have two processes
  # applying the same migration to production at once.
  group: migrate
  cancel-in-progress: false

jobs:
  dev:
    # Merging is enough for dev. It holds a synthetic household and nothing
    # anybody needs, so the cost of a bad migration there is a rebuild.
    if: github.event_name == 'push' || inputs.target == 'dev' || inputs.target == 'both'
    name: dev
    runs-on: ubuntu-latest
    # Whether anything was actually applied, so production can be told.
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    # actions:write buys one thing: waking schema-check once dev has actually
    # caught up, in the last step of this job. Reading is all the rest needs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Dev is optional, deliberately. Only PROD_DB_URL buys something nobody
      # else can do: a migration reaches production by this route or by
      # Jonathan pasting it, and there is no third way. Dev can be brought up
      # to date by either person through the Supabase connector whenever it
      # falls behind, so requiring a second secret before anything works at
      # all would be charging him twice for one thing.
      #
      # It says loudly that dev was skipped. A silent skip is how a database
      # drifts for a week without anybody noticing.
      - name: Is dev configured
        id: have
        env:
          URL: ${{ secrets.DEV_DB_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEV_DB_URL is not set, so dev was NOT migrated — somebody has to apply this to dev by hand. To automate it: Supabase → kin-dev → Connect → Session pooler → URI, with the database password in it, saved as DEV_DB_URL."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply what dev has not run
        id: apply
        if: steps.have.outputs.have == 'true'
        env:
          MIGRATE_DB_URL: ${{ secrets.DEV_DB_URL }}
          MIGRATE_LABEL: dev
        working-directory: kin
        run: |
          # pipefail, because the default shell does not set it and `tee`
          # would otherwise report success for a migration that died.
          set -o pipefail
          node scripts/migrate.mjs ${{ inputs.dry_run && '--dry-run' || '' }} | tee /tmp/migrate.log
          grep -q "migration(s) applied\." /tmp/migrate.log && echo "applied=true" >> "$GITHUB_OUTPUT" || true

      # automerge.yml wakes this job and schema-check.yml in the same breath,
      # so on a merge carrying a migration schema-check can easily ask dev
      # what it has before this job has given it anything -- and go red over a
      # gap seconds old. Asking again once the schema has moved settles it.
      # schema-check cancels its own in-progress run per ref, so this
      # supersedes the run that raced rather than adding a second one.
      #
      # Only when something was actually applied. Every merge wakes this job,
      # and most carry no migration at all; re-asking on those would double
      # schema-check's runs for nothing, on a metered Actions budget.
      - name: Ask schema-check again, now dev has it
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run schema-check.yml --repo "${{ github.repository }}" --ref main \
            && echo "asked schema-check to look again" \
            || echo "could not wake schema-check — run it by hand if main looks red"

  production:
    # Production used to wait for a person to press this, and that is what
    # went wrong on 21 September. The button is easy to forget, and what it
    # leaves behind is not a red tick somewhere -- it is a feature live in
    # front of the family that cannot work, because its table only exists in
    # the code. The liquid intake tracker shipped and sat dead in the app for
    # hours exactly that way, and the schema check that noticed stayed red
    # across every open pull request until somebody remembered.
    #
    # So it follows dev automatically now. The protection that mattered is
    # kept and made stricter rather than dropped: production only ever gets a
    # migration that has *already applied cleanly to dev minutes earlier*,
    # because this job needs dev and refuses to start unless dev succeeded.
    # A migration that is going to fail now fails on the synthetic household
    # first, where the cost of a bad one is a rebuild.
    #
    # It still only runs from main, and only after every check went green --
    # that is what merging means here. Dispatching target=production alone
    # remains, for putting production right by hand when the two have drifted.
    needs: dev
    # A push to main counts too, not just automerge's dispatch: a merge made
    # through the GitHub UI by a person fires push rather than being
    # dispatched, and dev following a migration that production does not is
    # the exact split this whole file exists to stop.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (
          inputs.target == 'production' ||
          (inputs.target == 'both' && needs.dev.result == 'success')
        ))
      )
    name: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refuse to run against production from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This was dispatched from ${{ github.ref }}. Production runs only what is on main."
          exit 1

      - name: Say which secret is missing, rather than failing cryptically
        env:
          URL: ${{ secrets.PROD_DB_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::PROD_DB_URL is not set. Supabase → kin-family-app → Connect → Session pooler → URI, with the database password in it."
            exit 1
          fi

      # Printed before anything runs, so the log says what was about to happen
      # even when the apply below fails.
      - name: What is production missing
        env:
          MIGRATE_DB_URL: ${{ secrets.PROD_DB_URL }}
          MIGRATE_LABEL: prod
        working-directory: kin
        run: node scripts/migrate.mjs --dry-run

      - name: Apply it
        if: ${{ !inputs.dry_run }}
        env:
          MIGRATE_DB_URL: ${{ secrets.PROD_DB_URL }}
          MIGRATE_LABEL: prod
        working-directory: kin
        run: node scripts/migrate.mjs
