name: TestFlight

# Builds Kin's iPhone app (kin/native), signs it and uploads it to
# TestFlight, from GitHub's macOS runner -- no Mac needed. Started by hand
# (Actions -> TestFlight -> Run workflow), never on a push: each upload is a
# new build for testers, and Apple reviews the first one.
#
# Signing is Xcode's own cloud-managed signing: with an App Store Connect
# API key, xcodebuild makes and renews the certificate and the profiles
# itself (-allowProvisioningUpdates). So the repository holds no certificate
# and no profile. The secrets (Jonathan adds them; SETUP_FOR_JONATHAN.md,
# "The iPhone app"):
#   APPLE_TEAM_ID              the 10-character Team ID
#   ASC_KEY_ID, ASC_ISSUER_ID  the App Store Connect API key's ids
#   ASC_KEY_P8                 the key file's contents (BEGIN PRIVATE KEY...)
#
# Never posts a check on a pull request, so automerge.yml does not list it.
#
# What each step's failure means, and what to do about it:
# kin/native/ios/TESTFLIGHT.md. The build number is this workflow's run
# number, so a re-run of an old run reuses its number and Apple refuses the
# upload ("bundle version must be higher"): start a new run instead.

on:
  workflow_dispatch:

jobs:
  upload:
    name: Build, sign and upload
    runs-on: macos-26
    # Its secrets live in the `main-only` environment, which hands them only
    # to a run from main (Settings → Environments → main-only → deployment
    # branches: main). A branch's copy of this file, or any other workflow on a
    # branch, cannot read them; while a secret still exists at repository level
    # too, the environment's copy wins here and the old one keeps working.
    environment: main-only
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kin/native
    steps:
      - name: The secrets are there
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        working-directory: .
        run: |
          missing=""
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in main-only:$missing. Add them to the main-only environment (Settings → Environments), not as repository secrets. See kin/docs/SETUP_FOR_JONATHAN.md, 'The iPhone app'."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kin/native/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: The API key, for signing and the upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kin.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) KIN_REQUIRE_ALARMKIT' \
            archive | tail -n 80
      # Both targets signed, by the right team, with the App Group: the
      # widgets read Today from it, and a profile without it signs fine but
      # leaves them empty. Printed so a wrong one is seen here, not on a phone.
      # Only a missing widget extension stops the run.
      - name: What was signed
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="$RUNNER_TEMP/Kin.xcarchive/Products/Applications/App.app"
          ok=1
          for t in "$app" "$app/PlugIns/KinWidgets.appex"; do
            if [ ! -d "$t" ]; then echo "::error::$(basename "$t") is not in the archive."; ok=0; continue; fi
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$t/Info.plist")
            ents=$(codesign -d --entitlements - --xml "$t" 2>/dev/null | plutil -convert xml1 -o - - 2>/dev/null || true)
            echo "== $id"
            codesign -dvv "$t" 2>&1 | grep -E "^(Authority|TeamIdentifier)=" || true
            echo "$ents" | grep -E "<key>|<string>" | sed 's/^[[:space:]]*//'
            # Warnings, not failures: the upload is still worth having, and
            # TESTFLIGHT.md says what each means.
            echo "$ents" | grep -q "group.com.jiesingian.kin" || echo "::warning::$id shows no App Group group.com.jiesingian.kin: its widgets will be empty (SETUP_FOR_JONATHAN.md section 9, step 3)."
            codesign -dvv "$t" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID" || echo "::warning::$id is not signed by team APPLE_TEAM_ID."
          done
          [ "$ok" = 1 ]
      - name: Sign for the App Store and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/App/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kin.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect -> TestFlight once Apple has processed it (usually 10-30 minutes)."
      - name: Forget the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
